<meta name="color-scheme" content="light dark">

<style>
@font-face{font-family:"Vazirmatn";font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/vazirmatn-arabic-wght-normal.woff2) format("woff2-variations"),url(fonts/vazirmatn-arabic-wght-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:"Vazirmatn";font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/vazirmatn-latin-wght-normal.woff2) format("woff2-variations"),url(fonts/vazirmatn-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Lalezar";font-style:normal;font-display:swap;font-weight:400;src:url(fonts/lalezar-arabic-400-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:"Lalezar";font-style:normal;font-display:swap;font-weight:400;src:url(fonts/lalezar-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font-size:14px;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
button,label,summary,input[type=checkbox]{touch-action:manipulation}
/* Layout: graph-paper planner — a big day numeral over a working list, with a side rail of tools (focus timer, timeline, habits, note) */
:root{
  --bg:#EEF2F1; --grid:#D9E1DF; --surface:#FFFFFF; --surface-2:#E6ECEA; --ink:#15201D; --muted:#5C6A66; --line:#D3DCD9;
  --accent-l:#0E7C72; --accent-d:#52D0BF; --accent:var(--accent-l); --on-accent:#FFFFFF;
  --danger:#C0392B; --ok:#2E7D4F; --warn:#A8670A; --shadow:0 1px 2px rgba(15,40,35,.06),0 6px 20px rgba(15,40,35,.06);
  --f-display:"Lalezar","Vazirmatn",Tahoma,sans-serif; --f-body:"Vazirmatn",Tahoma,"Segoe UI",system-ui,sans-serif;
  --water:#2F86C8; --fs:15px; --rad:12px; --gap:14px; --row:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1514; --grid:#1A2321; --surface:#161F1D; --surface-2:#1E2926; --ink:#E4EDEA; --muted:#93A39E; --line:#283431;
  --accent:var(--accent-d); --on-accent:#08110F; --water:#5AB0EE; --danger:#EF7A6C; --ok:#6CCB93; --warn:#E5A84B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1514; --grid:#1A2321; --surface:#161F1D; --surface-2:#1E2926; --ink:#E4EDEA; --muted:#93A39E; --line:#283431;
  --accent:var(--accent-d); --on-accent:#08110F; --water:#5AB0EE; --danger:#EF7A6C; --ok:#6CCB93; --warn:#E5A84B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark }

html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:1.6;
  background-image:radial-gradient(var(--grid) 1px,transparent 1.2px);background-size:22px 22px}
#app{max-width:1240px;margin:0 auto;padding-block:14px 80px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app.compact{--row:6px;--gap:10px}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto;min-width:0}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-display);font-size:20px;flex:none}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:5px 14px;border-radius:999px;color:var(--muted);font-weight:500}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:36px;min-width:36px;display:inline-grid;place-items:center;padding:0 8px;color:var(--ink)}
.iconbtn:hover{border-color:var(--accent)}
.search{position:relative}
.search input{height:36px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 34px 0 10px;width:190px;max-width:52vw}
.search svg{position:absolute;right:9px;top:9px;color:var(--muted)}
.sres{position:absolute;top:40px;inset-inline-end:0;width:min(340px,86vw);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:20;max-height:360px;overflow:auto;padding:6px}
.sres button{display:flex;gap:10px;width:100%;text-align:start;border:0;background:none;padding:7px 8px;border-radius:8px}
.sres button:hover{background:var(--surface-2)}
.sres small{color:var(--muted);flex:none}

.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--surface);border:1px dashed var(--accent);border-radius:var(--rad);padding:10px 14px;margin-bottom:14px}
.banner p{margin:0;flex:1 1 260px}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:14px}
.card h3{font-size:.95em;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card h3 .sp{margin-inline-start:auto;font-weight:400;color:var(--muted);font-size:.9em}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;display:inline-flex;align-items:center;gap:6px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--danger)}
.btn.sm{padding:3px 9px;font-size:.88em}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.8em;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.tag{font-size:.74em;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.hi{border-color:var(--danger);color:var(--danger)}
.tag.smp{border-style:dashed}
.empty{color:var(--muted);text-align:center;padding:22px 10px;border:1px dashed var(--line);border-radius:var(--rad)}

/* day head */
.dayhead{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;margin-bottom:16px}
.dnum{font-family:var(--f-display);font-size:86px;line-height:.9;color:var(--accent);min-width:1.1em;text-align:center}
.dmeta .wd{font-size:1.5em;font-weight:800}
.dmeta .mo{color:var(--muted)}
.dnav{display:flex;gap:6px;align-items:center}
.dstats{display:flex;gap:18px;margin-inline-start:auto;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:10px}
.stat b{font-size:1.25em;display:block;line-height:1.2}
.stat small{color:var(--muted)}
.ring{width:46px;height:46px}
.ring circle{fill:none;stroke-width:5}
.ring .bgc{stroke:var(--surface-2)}
.ring .fgc{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s}

.daygrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.col-main,.col-side{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
@media (max-width:900px){.daygrid{grid-template-columns:minmax(0,1fr)}.dnum{font-size:68px}}

.qadd{display:flex;gap:8px}
.qadd input{flex:1;min-width:0;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 14px}
.qadd input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.qhint{font-size:.78em;color:var(--muted);margin-top:-6px}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:.86em;display:inline-flex;align-items:center;gap:6px}
.fchip[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--ink)}
.filters select{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 9px;font-size:.86em;margin-inline-start:auto}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--rad)}
.grp{font-size:.78em;font-weight:700;color:var(--muted);padding:10px 14px 2px;letter-spacing:.02em}
.task{display:flex;gap:12px;align-items:flex-start;padding:var(--row) 14px;border-top:1px solid var(--line)}
.list .task:first-child,.grp+.task{border-top:0}
.task:hover{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--c,var(--accent));background:none;flex:none;margin-top:2px;display:grid;place-items:center;padding:0}
.chk svg{opacity:0;width:14px;height:14px;stroke:var(--on-accent);stroke-width:3}
.task.done .chk{background:var(--c,var(--accent))}
.task.done .chk svg{opacity:1}
.tbody{flex:1;min-width:0;cursor:pointer}
.ttl{font-weight:500;overflow-wrap:anywhere}
.task.done .ttl{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:2px;align-items:center}
.subs{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.subs label{display:flex;gap:8px;align-items:center;font-size:.9em;color:var(--muted);cursor:pointer;width:fit-content}
.subs input{accent-color:var(--accent);width:15px;height:15px}
.subs .sd{text-decoration:line-through}
.tact{display:flex;gap:2px;opacity:.55}
.task:hover .tact,.task:focus-within .tact{opacity:1}
.tact button{border:0;background:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.tact button:hover{background:var(--surface-2);color:var(--accent)}
.overdue{border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.overdue h3{color:var(--warn)}

/* pomodoro */
.pomo .modes{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.pomo .modes button{border:1px solid var(--line);background:none;border-radius:999px;padding:2px 10px;font-size:.82em;color:var(--muted)}
.pomo .modes button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.pwrap{display:flex;align-items:center;gap:16px}
.pring{width:112px;height:112px;position:relative;flex:none}
.pring svg{width:100%;height:100%;transform:rotate(-90deg)}
.pring circle{fill:none;stroke-width:7}
.pring .bgc{stroke:var(--surface-2)}
.pring .fgc{stroke:var(--accent);stroke-linecap:round}
.ptime{position:absolute;inset:0;display:grid;place-items:center;font-size:1.55em;font-weight:800}
.pside{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.pside select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 6px;font-size:.88em}
.pbtns{display:flex;gap:6px;flex-wrap:wrap}
.pill{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:calc(16px + env(safe-area-inset-left,0px));background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:8px 16px;font-weight:700;box-shadow:var(--shadow);z-index:30;display:flex;gap:8px;align-items:center}

/* timeline */
.tl{position:relative;border-top:1px solid var(--line);margin-top:4px;max-height:420px;overflow-y:auto}
.tl-inner{position:relative;margin-inline-start:42px;margin-top:12px;margin-bottom:6px}
.tl-h{height:44px;border-bottom:1px solid var(--line);position:relative}
.tl-h span{position:absolute;inset-inline-start:-42px;top:-9px;font-size:.72em;color:var(--muted);width:36px;text-align:end}
.tl-b{position:absolute;border-radius:8px;padding:2px 7px;font-size:.78em;overflow:hidden;line-height:1.4;border-inline-start:3px solid var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface));cursor:pointer}
.tl-b.done{opacity:.55;text-decoration:line-through}
.tl-now{position:absolute;inset-inline:0;border-top:2px solid var(--danger);z-index:2}
.tl-now::before{content:"";position:absolute;inset-inline-start:-5px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--danger)}

/* habits */
.hab{display:flex;flex-direction:column;gap:4px}
.hrow{display:flex;align-items:center;gap:10px;padding:4px 0}
.hrow .hn{flex:1;min-width:0}
.hrow .st{font-size:.78em;color:var(--muted)}
.hbtn{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;padding:0;flex:none}
.hbtn.on{background:var(--ok);border-color:var(--ok)}
.hbtn svg{width:14px;height:14px;stroke:#fff;stroke-width:3;opacity:0}
.hbtn.on svg{opacity:1}
textarea.note{width:100%;min-height:110px;resize:vertical;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;line-height:1.7}

/* week */
.weekhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:14px}
.weekhead h2{font-family:var(--f-display);font-weight:400;font-size:30px}
.wscroll{overflow-x:auto;padding-bottom:6px}
.wgrid{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;min-width:1080px}
.wcol{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:10px;display:flex;flex-direction:column;gap:6px;min-height:240px}
.wcol.today{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent)}
.wcol.over{background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.wch{display:flex;align-items:baseline;gap:6px;cursor:pointer}
.wch b{font-family:var(--f-display);font-weight:400;font-size:24px;color:var(--accent)}
.wch span{font-weight:700}
.bar{height:4px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.wt{display:flex;gap:7px;align-items:flex-start;padding:5px 7px;border-radius:8px;background:var(--bg);font-size:.88em;cursor:grab;border:1px solid transparent}
.wt:hover{border-color:var(--line)}
.wt .chk{width:17px;height:17px;border-radius:5px;margin-top:2px}
.wt .chk svg{width:11px;height:11px}
.wt.done .chk{background:var(--c)}
.wt.done .chk svg{opacity:1}
.wt.done span{text-decoration:line-through;color:var(--muted)}
.wt span{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer}
.wt small{color:var(--muted);display:block;font-size:.85em}
.wadd{border:1px dashed var(--line);background:none;border-radius:8px;padding:4px 8px;font-size:.85em;width:100%}
.wadd:focus{border-style:solid;border-color:var(--accent);outline:none}
.wlower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px;margin-top:16px}
@media (max-width:900px){.wlower{grid-template-columns:minmax(0,1fr)}}
.goal{display:flex;gap:10px;align-items:center;padding:5px 0}
.goal span{flex:1;min-width:0}
.goal.done span{text-decoration:line-through;color:var(--muted)}
.goal .x{opacity:0;border:0;background:none;color:var(--muted)}
.goal:hover .x{opacity:1}
.hmx{overflow-x:auto}
.hmx table{border-collapse:collapse;width:100%;min-width:420px}
.hmx th,.hmx td{padding:4px;text-align:center;font-weight:500}
.hmx th{font-size:.8em;color:var(--muted)}
.hmx td:first-child,.hmx th:first-child{text-align:start}
.hmx .hbtn{margin:auto;width:24px;height:24px}
.hmx .off{color:var(--line)}

/* month */
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mh{text-align:center;font-size:.8em;color:var(--muted);font-weight:700}
.mc{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:96px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:start}
.mc.out{opacity:.4}
.mc.today{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent)}
.mc b{font-size:1.05em}
.mc .mt{font-size:.74em;display:flex;gap:4px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .mt.d{color:var(--muted);text-decoration:line-through}
@media (max-width:600px){.mc{min-height:62px}.mc .mt{display:none}.mc .mdots{display:flex}}
.mdots{display:none;gap:3px;flex-wrap:wrap}

/* stats */
.sgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:760px){.sgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi b{font-size:1.9em;font-weight:800;display:block;line-height:1.1}
.kpi small{color:var(--muted)}
.delta{font-size:.8em;font-weight:700}
.delta.up{color:var(--ok)} .delta.down{color:var(--danger)}
.s2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.s2{grid-template-columns:minmax(0,1fr)}}
.chart{width:100%;height:auto;display:block}
.hbar{display:grid;grid-template-columns:90px minmax(0,1fr) 70px;gap:10px;align-items:center;padding:4px 0;font-size:.9em}
.hbar .tr{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:6px}
table.ht{width:100%;border-collapse:collapse;font-size:.9em}
table.ht td,table.ht th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:start}
table.ht th{color:var(--muted);font-weight:500;font-size:.85em}

/* dialogs */

  habits:[{id:'h1',name:'۷ ساعت خواب',days:[0,1,2,3,4,5,6]},{id:'h2',name:'مرور فلش‌کارت‌ها',days:[0,1,2,3,6]},{id:'h3',name:'ورزش ۲۰ دقیقه',days:[0,1,2,3,4,5,6]},{id:'h4',name:'۸ لیوان آب',days:[0,1,2,3,4,5,6]}],

}}
const emptyB=()=>({tasks:[],goals:{},habits:{},routines:{},notes:{},focus:{},jr:{},st:{}});
function merge(base,o){if(!o||typeof o!=='object')return base;for(const k in o){if(base[k]&&typeof base[k]==='object'&&!Array.isArray(base[k])&&o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k]))merge(base[k],o[k]);else base[k]=o[k]}return base}
const normB=b=>merge(emptyB(),b||{});

/* ---------- state ---------- */
const S={settings:defaults(),B:{},D:{},ptab:'day',view:'day',cur:today(),filter:'all',hideDone:false,sample:false,mode:'mem',db:null,uid:null,loading:new Set(),q:''};
const bkey=s=>{const diff=(dow(s)-6+7)%7;return 'w-'+addD(s,-diff)};

/* ---------- storage ---------- */
const dirty=new Set();let saveT=null;const chain={};let settingsSaved=false;
const ref=k=>S.db.collection('data/users/'+S.uid).doc(k);
function markDirty(k){dirty.add(k);if(!settingsSaved)dirty.add('settings');clearTimeout(saveT);saveT=setTimeout(flush,450)}
function flush(){clearTimeout(saveT);const keys=[...dirty];dirty.clear();
  for(const k of keys){const data=k==='settings'?S.settings:(S.D[k]||S.B[k]);if(!data)continue;const snap=clone(data);lsSet(k,snap);if(k==='settings')settingsSaved=true;
    if(S.mode==='db'){chain[k]=(chain[k]||Promise.resolve()).then(()=>ref(k).set(snap)).catch(e=>{toast(e&&e.code==='quota_exceeded'?'فضای ذخیره پر شده؛ چند هفته‌ی قدیمی را پاک کنید.':'ذخیره نشد؛ دوباره امتحان می‌کنم.');if(e&&e.code!=='quota_exceeded'&&e.code!=='invalid_argument'){dirty.add(k);saveT=setTimeout(flush,4000)}})}}}
window.addEventListener('pagehide',()=>{if(dirty.size)flush()});
const markL=b=>{Object.defineProperty(b,'__l',{enumerable:false,value:1,configurable:true});return b};
const loadP={};
function loadKey(k){if(S.B[k]&&S.B[k].__l)return Promise.resolve();if(loadP[k])return loadP[k];
  const pr=(async()=>{let nb;try{let d=null;if(S.mode==='db'){const sn=await ref(k).get();d=sn.exists?clone(sn.data()):null}else d=lsGet(k);
    nb=normB(d);const cur=S.B[k];if(cur&&!d&&(cur.tasks.length||Object.keys(cur.goals).length||Object.keys(cur.habits).length))nb=normB(clone(cur))}
  catch(e){nb=S.B[k]||emptyB()}S.B[k]=markL(nb)})();loadP[k]=pr;pr.finally(()=>{if(loadP[k]===pr)delete loadP[k]});return pr}
async function ensure(dates){const ks=[...new Set(dates.map(bkey))].filter(k=>!(S.B[k]&&S.B[k].__l));if(!ks.length)return false;await Promise.all(ks.map(loadKey));return true}

/* ---------- items ---------- */
function itemsOn(d){const b=B(d);const out=b.tasks.filter(t=>t.date===d).map(t=>({...t,kind:'t'}));
  const rd=(b.routines[d]||[]);const w=dow(d);
  for(const r of S.settings.routines){if(r.days.includes(w))out.push({id:'r:'+r.id,rid:r.id,date:d,title:r.title,cat:r.cat,prio:r.prio||1,start:r.start||'',end:r.end||'',subs:[],done:rd.includes(r.id),kind:'r'})}
  const tm=S.D.term;if(tm&&tm.showInDay!==false){if((!tm.start||d>=tm.start)&&(!tm.end||d<=tm.end))for(const c of tm.classes){if(c.sample||c.day!==w)continue;out.push({id:'c:'+c.id,date:d,title:c.title,cat:c.cat||'study',prio:1,start:c.start||'',end:c.end||'',subs:[],done:rd.includes('c:'+c.id),kind:'c',room:c.room})}
    for(const x of tm.deadlines){if(x.sample||x.date!==d)continue;out.push({id:'dl:'+x.id,date:d,title:x.title,cat:x.cat||'study',prio:2,start:x.time||'',end:'',subs:[],done:!!x.done,kind:'dl',dtype:x.type})}}
  return out}
function sortItems(a){const s=S.settings.sort,co=Object.fromEntries(S.settings.cats.map((c,i)=>[c.id,i]));
  const tm=x=>x.start?toMin(x.start):9999;
  return a.sort((x,y)=>{if(s==='prio')return (y.prio-x.prio)||(tm(x)-tm(y));if(s==='cat')return ((co[x.cat]??99)-(co[y.cat]??99))||(tm(x)-tm(y));return (tm(x)-tm(y))||(y.prio-x.prio)||((x.created||0)-(y.created||0))})}
const findTask=(id,d)=>B(d).tasks.find(t=>t.id===id);
function toggleItem(id,d){if(id.startsWith('dl:')){const x=S.D.term.deadlines.find(y=>y.id===id.slice(3));if(x){x.done=!x.done;markDirty('term')}render();return}if(id.startsWith('r:')||id.startsWith('c:')){const r=id.startsWith('r:')?id.slice(2):id,b=B(d);const a=b.routines[d]||(b.routines[d]=[]);const i=a.indexOf(r);i>=0?a.splice(i,1):a.push(r)}else{const t=findTask(id,d);if(!t)return;t.done=!t.done;}markDirty(bkey(d));render()}
async function moveTask(id,from,to){if(from===to)return;await ensure([to]);const b=B(from);const i=b.tasks.findIndex(t=>t.id===id);if(i<0)return;const t=b.tasks.splice(i,1)[0];t.date=to;B(to).tasks.push(t);markDirty(bkey(from));markDirty(bkey(to));render()}
function addTask(d,o){const t=Object.assign({id:rid(),date:d,title:'',cat:S.filter!=='all'?S.filter:(S.settings.cats[0]||{}).id||'none',prio:1,start:'',end:'',est:0,notes:'',subs:[],done:false,spent:0,created:Date.now()},o);B(d).tasks.push(t);markDirty(bkey(d));return t}
function parseQuick(txt,d){let s=en(txt).trim();const o={};
  if(/(^|\s)!+(\s|$)/.test(s)){o.prio=2;s=s.replace(/(^|\s)!+(?=\s|$)/g,' ')}
  const m=s.match(/(\d{1,2}):(\d{2})(?:\s*-\s*(\d{1,2}):(\d{2}))?/);if(m){o.start=pad(m[1])+':'+m[2];if(m[3])o.end=pad(m[3])+':'+m[4];s=s.replace(m[0],' ')}
  const c=s.match(/#(\S+)/);if(c){const cat=S.settings.cats.find(x=>x.name===c[1])||S.settings.cats.find(x=>x.name.startsWith(c[1]));if(cat){o.cat=cat.id;s=s.replace(c[0],' ')}}
  if(/@فردا/.test(s)){d=addD(d,1);s=s.replace('@فردا',' ')}
  o.title=s.replace(/\s+/g,' ').trim();return{d,o}}

function taskRow(t,opts={}){const c=catOf(t.cat);const sd=t.subs.filter(s=>s.d).length;

    ${t.kind==='t'&&!t.done&&!opts.overdue?`<button data-act="tomorrow" title="انتقال به فردا" aria-label="انتقال به فردا">${I.move}</button>`:''}</div>
  </div>`}

function vDay(){const d=S.cur,j=jal(d),st=S.settings;const all=itemsOn(d);const done=all.filter(x=>x.done).length;

  <div class="daygrid"><div class="col-main">

function timelineCard(d,all){const st=S.settings,f=st.hours.from,t=st.hours.to,H=44;
  const bl=all.filter(x=>x.start).map(x=>{const s=toMin(x.start);let e=x.end?toMin(x.end):s+(x.est||30);if(e<=s)e=s+30;return{x,s,e}}).sort((a,b)=>a.s-b.s);
  const lanesEnd=[];bl.forEach(b=>{let l=lanesEnd.findIndex(e=>e<=b.s);if(l<0){l=lanesEnd.length;lanesEnd.push(b.e)}else lanesEnd[l]=b.e;b.l=l});const L=Math.max(1,lanesEnd.length);
  let hrs='';for(let h=f;h<t;h++)hrs+=`<div class="tl-h"><span class="num">${fa(pad(h))}:۰۰</span></div>`;
  const blocks=bl.map(b=>{const top=(b.s-f*60)/60*H,h=Math.max(20,(b.e-b.s)/60*H-2);if(b.e<f*60||b.s>t*60)return'';const c=catOf(b.x.cat).color;
    return `<div class="tl-b${b.x.done?' done':''}" style="--c:${c};top:${top}px;height:${h}px;inset-inline-start:${b.l/L*100}%;width:calc(${100/L}% - 4px)" data-id="${b.x.id}" data-date="${b.x.date}" data-act="${b.x.kind==='t'?'edit':'toggle'}" title="${esc(b.x.title)}"><b class="num">${fmtT(b.x.start)}</b> ${esc(b.x.title)}</div>`}).join('');
  const now=new Date();const nm=now.getHours()*60+now.getMinutes();const nowL=d===today()&&nm>=f*60&&nm<=t*60?`<div class="tl-now" style="top:${(nm-f*60)/60*H}px"></div>`:'';
  return `<section class="card"><h3>برنامه‌ی ساعتی<span class="sp num">${fa(bl.length)} بلوک زمانی</span></h3><div class="tl" id="tl"><div class="tl-inner" style="height:${(t-f)*H}px">${hrs}${blocks}${nowL}</div></div></section>`}

function habitStreak(h,d){let n=0,cur=d;const has=x=>(B(x).habits[x]||[]).includes(h.id);if(!has(cur))cur=addD(cur,-1);
  for(let i=0;i<60;i++){const k=bkey(cur);if(!S.B[k])break;if(!h.days.includes(dow(cur))){cur=addD(cur,-1);continue}if(has(cur)){n++;cur=addD(cur,-1)}else break}return n}
function habitsCard(d){const hs=S.settings.habits.filter(h=>h.days.includes(dow(d)));const on=B(d).habits[d]||[];
  return `<section class="card"><h3>عادت‌های امروز<span class="sp num">${fa(hs.filter(h=>on.includes(h.id)).length)} از ${fa(hs.length)}</span></h3>
   ${hs.length?`<div class="hab">${hs.map(h=>{const st=habitStreak(h,d);return `<div class="hrow"><button class="hbtn${on.includes(h.id)?' on':''}" data-act="habit" data-h="${h.id}" data-date="${d}" aria-label="${esc(h.name)}" aria-pressed="${on.includes(h.id)}">${I.chk}</button><span class="hn">${esc(h.name)}</span>${st?`<span class="st num">${fa(st)} روز پیاپی</span>`:''}</div>`}).join('')}</div>`:'<div class="muted">عادتی برای امروز تعریف نشده. از تنظیمات اضافه کن.</div>'}
  </section>`}

/* --- week --- */
function vWeek(){const ds=weekDates(S.cur),st=S.settings,t0=today();const a=ds[0],z=ds[6],ja=jal(a),jz=jal(z);
  const title=ja.m===jz.m?`${fa(ja.d)} تا ${fa(jz.d)} ${MONTHS[ja.m-1]}`:`${jlabel(a)} تا ${jlabel(z)}`;
  const gl=B(a).goals[a]||[];
  const cols=ds.map(d=>{const it=sortItems(itemsOn(d).filter(x=>S.filter==='all'||x.cat===S.filter));const dn=it.filter(x=>x.done).length;
    return `<div class="wcol${d===t0?' today':''}" data-drop="${d}">
     <div class="wch" data-act="goday" data-date="${d}" title="باز کردن روز"><b class="num">${fa(jal(d).d)}</b><span>${WD[dow(d)]}</span><small class="muted num" style="margin-inline-start:auto">${fa(dn)}/${fa(it.length)}</small></div>
     <div class="bar"><i style="width:${it.length?dn/it.length*100:0}%"></i></div>
     ${it.map(x=>`<div class="wt${x.done?' done':''}" ${x.kind==='t'?'draggable="true"':''} data-id="${x.id}" data-date="${d}"><button class="chk" style="--c:${catOf(x.cat).color}" data-act="toggle" aria-label="انجام شد: ${esc(x.title)}">${I.chk}</button><span data-act="${x.kind==='t'?'edit':'toggle'}">${esc(x.title)}${x.start?`<small class="num">${fmtT(x.start)}${x.end?'–'+fmtT(x.end):''}${x.kind==='r'?'، تکراری':''}</small>`:x.kind==='r'?'<small>تکراری</small>':''}</span></div>`).join('')}
     <input class="wadd" data-addday="${d}" id="wadd-${d}" placeholder="+ افزودن" aria-label="افزودن کار به ${WD[dow(d)]}">
    </div>`}).join('');
  const hs=st.habits;
  return `<div class="weekhead"><h2>${title}</h2><span class="muted num">${MONTHS[ja.m-1]} ${fa(ja.y)}</span>
    <div class="dnav" style="margin-inline-start:auto"><button class="iconbtn" data-act="shift" data-n="-7" aria-label="هفته قبل" title="هفته قبل">${I.prev}</button><button class="btn sm" data-act="today">این هفته</button><button class="iconbtn" data-act="shift" data-n="7" aria-label="هفته بعد" title="هفته بعد">${I.next}</button></div></div>
   <div class="filters" style="margin-bottom:12px"><button class="fchip" data-act="filter" data-c="all" aria-pressed="${S.filter==='all'}">همه</button>${st.cats.map(c=>`<button class="fchip" data-act="filter" data-c="${c.id}" aria-pressed="${S.filter===c.id}"><i class="dot" style="background:${c.color}"></i>${esc(c.name)}</button>`).join('')}<span class="muted" style="font-size:.82em;margin-inline-start:auto">کارها را بین روزها بکش و رها کن.</span></div>
   <div class="wscroll"><div class="wgrid">${cols}</div></div>
   <div class="wlower">
    <section class="card"><h3>هدف‌های این هفته<span class="sp num">${fa(gl.filter(g=>g.d).length)} از ${fa(gl.length)}</span></h3>
     ${gl.map(g=>`<div class="goal${g.d?' done':''}"><button class="hbtn${g.d?' on':''}" data-act="goal" data-g="${g.id}" aria-pressed="${g.d}" aria-label="${esc(g.t)}">${I.chk}</button><span>${esc(g.t)}${g.sample?' <span class="tag smp">نمونه</span>':''}</span><button class="x" data-act="delGoal" data-g="${g.id}" aria-label="حذف هدف">${I.x}</button></div>`).join('')}
     <form id="gform" class="qadd" style="margin-top:8px"><input id="ga" placeholder="هدف تازه برای این هفته" aria-label="هدف تازه"><button class="btn" type="submit">${I.plus}</button></form>
    </section>
    <section class="card"><h3>جدول عادت‌ها</h3>${hs.length?`<div class="hmx"><table><thead><tr><th>عادت</th>${ds.map(d=>`<th>${WDS[dow(d)]}<br><span class="num">${fa(jal(d).d)}</span></th>`).join('')}</tr></thead><tbody>
     ${hs.map(h=>`<tr><td>${esc(h.name)}</td>${ds.map(d=>{if(!h.days.includes(dow(d)))return '<td class="off">–</td>';const on=(B(d).habits[d]||[]).includes(h.id);return `<td><button class="hbtn${on?' on':''}" data-act="habit" data-h="${h.id}" data-date="${d}" aria-pressed="${on}" aria-label="${esc(h.name)} ${WD[dow(d)]}">${I.chk}</button></td>`}).join('')}</tr>`).join('')}
    </tbody></table></div>`:'<div class="muted">عادتی تعریف نشده.</div>'}</section>
   </div>`}

/* --- month --- */
function monthCells(s){let f=s;while(jal(f).d!==1)f=addD(f,-1);const m=jal(f).m;let l=f;while(jal(addD(l,1)).m===m)l=addD(l,1);
  const start=wstart(f);const cells=[];let c=start;while(true){cells.push(c);if(c>=l&&cells.length%7===0)break;c=addD(c,1)}return{f,l,m,cells}}
function vMonth(){const {f,m,cells}=monthCells(S.cur);const j=jal(f),t0=today();
  const hd=[0,1,2,3,4,5,6].map(i=>WD[(S.settings.weekStart+i)%7]);
  return `<div class="weekhead"><h2>${MONTHS[m-1]} ${fa(j.y)}</h2>
   <div class="dnav" style="margin-inline-start:auto"><button class="iconbtn" data-act="month" data-n="-1" aria-label="ماه قبل" title="ماه قبل">${I.prev}</button><button class="btn sm" data-act="today">این ماه</button><button class="iconbtn" data-act="month" data-n="1" aria-label="ماه بعد" title="ماه بعد">${I.next}</button></div></div>
  <div class="mgrid">${hd.map(h=>`<div class="mh">${h}</div>`).join('')}
  ${cells.map(d=>{const it=sortItems(itemsOn(d).filter(x=>(x.kind==='t'||x.kind==='dl')&&(S.filter==='all'||x.cat===S.filter)));const jd=jal(d);
    return `<button class="mc${jd.m!==m?' out':''}${d===t0?' today':''}" data-act="goday" data-date="${d}" aria-label="${WD[dow(d)]} ${jlabel(d)}: ${fa(it.length)} کار"><b class="num">${fa(jd.d)}</b>
     ${it.slice(0,3).map(x=>`<span class="mt${x.done?' d':''}"><i class="dot" style="background:${catOf(x.cat).color}"></i>${esc(x.title)}</span>`).join('')}${it.length>3?`<span class="mt muted num">+${fa(it.length-3)} کار دیگر</span>`:''}
     <span class="mdots">${it.slice(0,6).map(x=>`<i class="dot" style="background:${catOf(x.cat).color};opacity:${x.done?.4:1}"></i>`).join('')}</span></button>`}).join('')}
  </div>`}

/* --- stats --- */
function weekStats(ds){let tot=0,dn=0,foc=0,hd=0,hp=0;const byCat={},perDay=[];
  ds.forEach(d=>{const it=itemsOn(d);const x=it.filter(i=>i.done).length;tot+=it.length;dn+=x;perDay.push({d,t:it.length,x});
    const f=B(d).focus[d]||{};for(const k in f){foc+=f[k];byCat[k]=(byCat[k]||0)+f[k]}
    S.settings.habits.forEach(h=>{if(h.days.includes(dow(d))&&d<=today()){hp++;if((B(d).habits[d]||[]).includes(h.id))hd++}})});
  return{tot,dn,foc,hd,hp,byCat,perDay}}
function delta(a,b,suf=''){if(b===0&&a===0)return '';const df=a-b;if(!df)return '<span class="delta">بدون تغییر</span>';return `<span class="delta ${df>0?'up':'down'} num">${df>0?'+':'−'}${fa(Math.abs(Math.round(df)))}${suf} نسبت به هفته‌ی قبل</span>`}
function vStats(){const ds=weekDates(S.cur),pv=weekDates(addD(S.cur,-7));const a=weekStats(ds),b=weekStats(pv);
  const pct=x=>x.tot?Math.round(x.dn/x.tot*100):0,hpct=x=>x.hp?Math.round(x.hd/x.hp*100):0;
  const W=700,H=230,pl=34,pb=34,pt=14,cw=(W-pl-10)/7,mx=Math.max(4,...a.perDay.map(p=>p.t));const yt=Math.ceil(mx/4);const ym=yt*4;
  const y=v=>pt+(H-pt-pb)*(1-v/ym);
  let grid='';for(let i=0;i<=4;i++){const v=i*yt;grid+=`<line x1="${pl}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="${i?'3 4':''}"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fa(v)}</text>`}
  const bars=a.perDay.map((p,i)=>{const x=pl+i*cw+cw*.2,w=cw*.6;return `<rect x="${x}" y="${y(p.t)}" width="${w}" height="${y(0)-y(p.t)}" rx="5" fill="var(--surface-2)"/><rect x="${x}" y="${y(p.x)}" width="${w}" height="${y(0)-y(p.x)}" rx="5" fill="var(--accent)"/>${p.t?`<text x="${x+w/2}" y="${y(p.t)-5}" text-anchor="middle" font-size="11" fill="var(--muted)">${fa(p.x)}/${fa(p.t)}</text>`:''}<text x="${x+w/2}" y="${H-12}" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="${p.d===today()?800:400}">${WD[dow(p.d)]}</text>`}).join('');
  const cats=Object.entries(a.byCat).sort((x,y)=>y[1]-x[1]);const cmax=Math.max(1,...cats.map(c=>c[1]));
  const ja=jal(ds[0]);
  return `<div class="weekhead"><h2>آمار هفته</h2><span class="muted">${jlabel(ds[0])} تا ${jlabel(ds[6])} ${fa(ja.y)}</span>
   <div class="dnav" style="margin-inline-start:auto"><button class="iconbtn" data-act="shift" data-n="-7" aria-label="هفته قبل">${I.prev}</button><button class="btn sm" data-act="today">این هفته</button><button class="iconbtn" data-act="shift" data-n="7" aria-label="هفته بعد">${I.next}</button></div></div>
  <div class="sgrid">
   <div class="card kpi"><small>کارهای انجام‌شده</small><b class="num">${fa(a.dn)}<span class="muted" style="font-size:.5em"> از ${fa(a.tot)}</span></b>${delta(a.dn,b.dn)}</div>
   <div class="card kpi"><small>درصد انجام</small><b class="num">${fa(pct(a))}٪</b>${delta(pct(a),pct(b),'٪')}</div>
   <div class="card kpi"><small>زمان تمرکز</small><b class="num">${fa((a.foc/60).toFixed(1))}<span class="muted" style="font-size:.5em"> ساعت</span></b>${delta(a.foc,b.foc,' دقیقه')}</div>
   <div class="card kpi"><small>پایبندی به عادت‌ها</small><b class="num">${fa(hpct(a))}٪</b>${delta(hpct(a),hpct(b),'٪')}</div>
  </div>
  <div class="s2">
   <section class="card"><h3>انجام کارها در روزهای هفته<span class="sp"><i class="dot" style="background:var(--accent)"></i> انجام‌شده &nbsp;<i class="dot" style="background:var(--surface-2);border:1px solid var(--line)"></i> کل</span></h3>
    <div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="نمودار کارهای انجام‌شده در هر روز" style="min-width:460px">${grid}${bars}</svg></div></section>
   <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
   <section class="card"><h3>تمرکز بر اساس دسته</h3>${cats.length?cats.map(([k,v])=>{const c=catOf(k);return `<div class="hbar"><span><i class="dot" style="background:${c.color}"></i> ${esc(c.name)}</span><div class="tr"><i style="width:${v/cmax*100}%;background:${c.color}"></i></div><span class="num muted">${fmtMin(v)}</span></div>`}).join(''):'<div class="muted">هنوز جلسه‌ی تمرکزی ثبت نشده. تایمر را از نمای روز شروع کن.</div>'}</section>
   <section class="card"><h3>عادت‌ها</h3>${S.settings.habits.length?`<table class="ht"><thead><tr><th>عادت</th><th>این هفته</th><th>رکورد پیاپی</th></tr></thead><tbody>${S.settings.habits.map(h=>{const p=ds.filter(d=>h.days.includes(dow(d))&&d<=today());const x=p.filter(d=>(B(d).habits[d]||[]).includes(h.id)).length;return `<tr><td>${esc(h.name)}</td><td class="num">${fa(x)} از ${fa(p.length)}</td><td class="num">${fa(habitStreak(h,today()))} روز</td></tr>`}).join('')}</tbody></table>`:'<div class="muted">عادتی تعریف نشده.</div>'}</section>
   </div></div>`}

/* ---------- task editor ---------- */
let edit=null;
function openEditor(id,d,preset){let t;if(id){t=clone(findTask(id,d));if(!t)return}else t=Object.assign({id:null,date:d||S.cur,title:'',cat:(S.settings.cats[0]||{}).id,prio:1,start:'',end:'',est:0,notes:'',subs:[],done:false},preset||{});
  edit={t,orig:id?d:null,rep:[],confirmDel:false};drawEditor();$('#taskDlg').showModal();setTimeout(()=>{const e=$('#e-title');e&&e.focus()},30)}
function drawEditor(){const t=edit.t,st=S.settings;
  $('#taskDlg').innerHTML=`<form class="dlg" id="eform" method="dialog"><header><h2>${edit.orig?'ویرایش کار':'کار تازه'}</h2><button type="button" class="iconbtn" data-act="closeDlg" aria-label="بستن">${I.x}</button></header>
  <div class="body">
   <label class="fld"><span>عنوان</span><input id="e-title" value="${esc(t.title)}" required></label>
   <div class="row2"><label class="fld"><span>تاریخ</span><input type="date" id="e-date" value="${t.date}"></label>
    <label class="fld"><span>دسته</span><select id="e-cat">${st.cats.map(c=>`<option value="${c.id}" ${t.cat===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label></div>
   <div class="row2"><label class="fld"><span>ساعت شروع</span><input type="time" id="e-start" value="${t.start||''}"></label>
    <label class="fld"><span>ساعت پایان</span><input type="time" id="e-end" value="${t.end||''}"></label>
    <label class="fld"><span>زمان تخمینی (دقیقه)</span><input type="number" min="0" step="5" id="e-est" value="${t.est||''}"></label></div>
   <label class="fld"><span>یادآور (برای کارهای ساعت‌دار)</span><select id="e-rem">${[['','پیش‌فرض ('+remLabel(S.settings.remind.before)+')'],['-1','بدون یادآور'],['0','سر وقت'],['5','۵ دقیقه قبل'],['10','۱۰ دقیقه قبل'],['15','۱۵ دقیقه قبل'],['30','۳۰ دقیقه قبل'],['60','یک ساعت قبل'],['120','دو ساعت قبل']].map(([v,l])=>`<option value="${v}" ${String(t.rem??'')===v?'selected':''}>${l}</option>`).join('')}</select></label>
   <div class="fld"><span>اهمیت</span><div class="seg" id="e-prio">${[[0,'کم'],[1,'معمولی'],[2,'مهم']].map(([v,l])=>`<button type="button" data-act="eprio" data-v="${v}" aria-pressed="${t.prio===v}">${l}</button>`).join('')}</div></div>
   <div class="fld"><span>زیرکارها (چک‌لیست)</span><div class="sublist" id="e-subs">${t.subs.map((s,i)=>`<div class="subrow"><input type="checkbox" data-si="${i}" class="e-sd" ${s.d?'checked':''} aria-label="انجام شد"><input type="text" class="e-st" data-si="${i}" value="${esc(s.t)}"><button type="button" class="iconbtn" data-act="esubdel" data-si="${i}" aria-label="حذف">${I.x}</button></div>`).join('')}
    <div class="subrow"><input type="text" id="e-newsub" placeholder="+ زیرکار تازه و Enter"></div></div></div>
   <label class="fld"><span>یادداشت</span><textarea id="e-notes" placeholder="لینک منبع، صفحه‌های کتاب، جزئیات…">${esc(t.notes||'')}</textarea></label>
   <div class="fld"><span>تکرار در روزهای هفته (اختیاری؛ کار به «کار تکراری» تبدیل می‌شود)</span><div class="days" id="e-rep">${[6,0,1,2,3,4,5].map(w=>`<button type="button" data-act="erep" data-w="${w}" aria-pressed="${edit.rep.includes(w)}">${WDS[w]}</button>`).join('')}</div></div>
   ${t.spent?`<div class="muted num">زمان تمرکز ثبت‌شده: ${fmtMin(t.spent)}</div>`:''}
  </div>
  <footer>${edit.orig?`<button type="button" class="btn danger" data-act="edel">${I.trash}${edit.confirmDel?'مطمئنی؟ حذف کن':'حذف'}</button><button type="button" class="btn" data-act="edup">کپی</button>`:''}<span class="grow"></span><button type="button" class="btn ghost" data-act="closeDlg">انصراف</button><button type="submit" class="btn pri">ذخیره</button></footer></form>`}
function readEditor(){const t=edit.t;t.title=$('#e-title').value.trim();t.date=$('#e-date').value||t.date;t.cat=$('#e-cat').value;t.start=$('#e-start').value;t.end=$('#e-end').value;t.est=+$('#e-est').value||0;t.notes=$('#e-notes').value;{const rv=$('#e-rem').value;if(rv==='')delete t.rem;else t.rem=+rv}
  document.querySelectorAll('.e-st').forEach(i=>{t.subs[+i.dataset.si].t=i.value});document.querySelectorAll('.e-sd').forEach(i=>{t.subs[+i.dataset.si].d=i.checked});
  const ns=$('#e-newsub');if(ns&&ns.value.trim()){t.subs.push({id:rid(),t:ns.value.trim(),d:false});ns.value=''}}
async function saveEditor(){readEditor();const t=edit.t;if(!t.title){$('#e-title').focus();return}
  t.subs=t.subs.filter(s=>s.t.trim());
  if(edit.rep.length){S.settings.routines.push({id:rid(),title:t.title,cat:t.cat,start:t.start,end:t.end,prio:t.prio,days:edit.rep.slice()});markDirty('settings');
    if(edit.orig){const b=B(edit.orig);b.tasks=b.tasks.filter(x=>x.id!==t.id);markDirty(bkey(edit.orig))}$('#taskDlg').close();toast('کار تکراری ساخته شد');render();return}
  await ensure([t.date]);
  if(edit.orig){const ob=B(edit.orig);const i=ob.tasks.findIndex(x=>x.id===t.id);delete t.sample;if(edit.orig!==t.date||bkey(edit.orig)!==bkey(t.date)){ob.tasks.splice(i,1);B(t.date).tasks.push(t);markDirty(bkey(edit.orig))}else ob.tasks[i]=t;markDirty(bkey(t.date))}
  else{t.id=rid();t.created=Date.now();t.spent=0;B(t.date).tasks.push(t);markDirty(bkey(t.date))}
  $('#taskDlg').close();render()}

/* ---------- settings ---------- */

   <div class="fld"><span>بخش‌های نمای روز</span>${yes('show.pomo','تایمر تمرکز (پومودورو)')}${yes('show.timeline','برنامه‌ی ساعتی')}${yes('show.habits','عادت‌ها')}${yes('show.note','یادداشت روز')}${yes('show.overdue','کارهای مانده از روزهای قبل')}</div>`;
  if(stab==='cats')body=`<p class="muted" style="margin:0">دسته‌ها برای رنگ‌بندی، فیلتر و آمار تمرکز به کار می‌روند. در کادر سریع با #نام‌دسته انتخاب می‌شوند.</p>
   ${st.cats.map((c,i)=>`<div class="lrow"><input type="color" data-l="cats" data-i="${i}" data-f="color" value="${c.color}" aria-label="رنگ"><input type="text" data-l="cats" data-i="${i}" data-f="name" value="${esc(c.name)}" aria-label="نام دسته"><button type="button" class="iconbtn" data-act="ldel" data-l="cats" data-i="${i}" aria-label="حذف دسته">${I.trash}</button></div>`).join('')}

   <button type="button" class="btn" data-act="ladd" data-l="routines">${I.plus}کار تکراری تازه</button>`;
  if(stab==='pomo')body=`<div class="row2"><label class="fld"><span>جلسه‌ی کار (دقیقه)</span><input type="number" min="1" max="180" data-k="pomo.work" data-t="num" value="${st.pomo.work}"></label><label class="fld"><span>استراحت کوتاه</span><input type="number" min="1" max="60" data-k="pomo.short" data-t="num" value="${st.pomo.short}"></label><label class="fld"><span>استراحت بلند</span><input type="number" min="1" max="90" data-k="pomo.long" data-t="num" value="${st.pomo.long}"></label><label class="fld"><span>استراحت بلند بعد از چند جلسه</span><input type="number" min="1" max="12" data-k="pomo.every" data-t="num" value="${st.pomo.every}"></label></div>
   ${yes('pomo.auto','شروع خودکار مرحله‌ی بعد')}${yes('pomo.sound','صدای پایان جلسه')}
   <p class="muted" style="margin:0">زمان هر جلسه‌ی کامل به دسته‌ی کار انتخاب‌شده و خود کار اضافه می‌شود و در آمار می‌آید.</p>`;
  if(stab==='remind')body=`${yes('remind.on','یادآور کارهای ساعت‌دار')}
   <div class="fld"><span>زمان پیش‌فرض یادآور</span><div class="seg">${[0,5,10,15,30,60].map(v=>`<button type="button" data-act="sset" data-k="remind.before" data-v="${v}" data-t="num" aria-pressed="${st.remind.before===v}">${remLabel(v)}</button>`).join('')}</div></div>
   ${yes('remind.sound','پخش صدا هنگام یادآوری')}
   <p class="muted" style="margin:0">یادآور برای هر کار، کار تکراری یا کلاسی که ساعت شروع دارد، در همان زمان داخل برنامه نشان داده می‌شود و اگر برنامه در پس‌زمینه باشد و اعلان را فعال کرده باشی، اعلان هم می‌آید. برای یادآوری حتی وقتی برنامه بسته است، از «تقویم گوشی» استفاده کن. برای هر کار جداگانه هم می‌شود زمان یادآور را در پنجره‌ی ویرایش عوض کرد. مرورگرها صدا را فقط بعد از اولین کلیک روی صفحه پخش می‌کنند.</p>`;
  if(stab==='data')body=`<p class="muted" style="margin:0">${S.mode==='db'?'برنامه‌ات در حساب Claude تو ذخیره می‌شود و فقط خودت آن را می‌بینی؛ روی هر دستگاهی که این صفحه را باز کنی در دسترس است.':'برنامه‌ات فقط روی همین دستگاه ذخیره می‌شود و به اینترنت نیازی ندارد. برای انتقال به دستگاه دیگر، اینجا فایل پشتیبان بگیر و در دستگاه دیگر «بازگردانی از فایل» را بزن. فایل پشتیبانی که از نسخه‌ی Claude گرفته‌ای هم همین‌جا وارد می‌شود.'+(lsGet('lastBackup')?' آخرین پشتیبان: '+jlabel(iso(new Date(lsGet('lastBackup'))))+'.':'')}</p>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn" data-act="export">گرفتن فایل پشتیبان (JSON)</button><label class="btn" style="cursor:pointer">بازگردانی از فایل<input type="file" id="imp" accept=".json,application/json" class="sr"></label>${S.sample?'<button type="button" class="btn" data-act="clearSample">حذف داده‌های نمونه</button>':''}</div>
   ${exportText?`<label class="fld"><span>متن پشتیبان را کپی کن و جایی نگه دار</span><textarea id="exptxt" readonly style="min-height:120px;direction:ltr">${esc(exportText)}</textarea></label><button type="button" class="btn sm" data-act="copyExp">کپی متن</button>`:''}
   <hr style="border:0;border-top:1px solid var(--line);width:100%">
   <button type="button" class="btn danger" data-act="resetAll">${I.trash}${confirmReset?'برای پاک شدن همه‌چیز دوباره بزن':'پاک کردن همه‌ی داده‌ها'}</button>`;
  if(stab==='app'||stab==='cal')body=pwaTab(stab);
  $('#setDlg').innerHTML=`<div class="dlg"><header><h2>تنظیمات و شخصی‌سازی</h2><button type="button" class="iconbtn" data-act="closeSet" aria-label="بستن">${I.x}</button></header>
   <nav class="stabs">${tabs.map(([k,l])=>`<button type="button" data-act="stab" data-tab="${k}" aria-pressed="${stab===k}">${l}</button>`).join('')}</nav>
   <div class="body" id="sbody">${body}</div><footer><span class="grow muted" style="font-size:.85em">تغییرها خودکار ذخیره می‌شوند.</span><button type="button" class="btn pri" data-act="closeSet">تمام</button></footer></div>`;pwaAfterSettings(stab)}
function get(k){return k.split('.').reduce((o,p)=>o&&o[p],S.settings)}
function set(k,v){const ps=k.split('.');let o=S.settings;for(let i=0;i<ps.length-1;i++)o=o[ps[i]];o[ps[ps.length-1]]=v}
function settingsChanged(redraw){markDirty('settings');applyLook();render();if(redraw)drawSettings()}

/* ---------- pomodoro ---------- */
let PM=lsGet('pomo')||{mode:'work',run:false,end:0,left:0,count:0,task:'',tdate:''};
const pDur=m=>(S.settings.pomo[m]||25)*60;
if(!PM.left)PM.left=pDur(PM.mode);
const pLeft=()=>PM.run?Math.max(0,Math.round((PM.end-Date.now())/1000)):PM.left;
const fmtS=s=>fa(pad(Math.floor(s/60)))+':'+fa(pad(s%60));
function pomoCard(){const d=today();const opts=itemsOn(d).filter(x=>!x.done&&x.kind==='t');const n=Object.values(B(d).focus[d]||{}).reduce((a,b)=>a+b,0);const c=2*Math.PI*48;
  return `<section class="card pomo" id="pomo"><h3>تایمر تمرکز<span class="sp num" id="pcount">${fa(PM.count)} جلسه، امروز ${fmtMin(n)}</span></h3>
   <div class="modes">${[['work','کار'],['short','استراحت کوتاه'],['long','استراحت بلند']].map(([k,l])=>`<button data-act="pmode" data-m="${k}" aria-pressed="${PM.mode===k}">${l}</button>`).join('')}</div>
   <div class="pwrap"><div class="pring"><svg viewBox="0 0 112 112" aria-hidden="true"><circle class="bgc" cx="56" cy="56" r="48"/><circle class="fgc" id="pring" cx="56" cy="56" r="48" stroke-dasharray="${c}" stroke-dashoffset="0"/></svg><div class="ptime num" id="ptime">${fmtS(pLeft())}</div></div>
    <div class="pside"><select id="ptask" aria-label="کار در حال تمرکز"><option value="">بدون کار مشخص</option>${opts.map(o=>`<option value="${o.id}" ${PM.task===o.id?'selected':''}>${esc(o.title)}</option>`).join('')}</select>
     <div class="pbtns"><button class="btn pri" data-act="pstart" id="pbtn">${PM.run?I.pause+'توقف':I.play+'شروع'}</button><button class="iconbtn" data-act="preset" title="از نو" aria-label="از نو">${I.reset}</button><button class="iconbtn" data-act="pskip" title="رد کردن مرحله" aria-label="رد کردن مرحله">${I.skip}</button></div></div></div>
  </section>`}
function pomoPaint(){const l=pLeft(),tot=pDur(PM.mode);const r=$('#pring');if(r){const c=2*Math.PI*48;r.style.strokeDashoffset=c*(1-(tot-l)/tot)}
  const t=$('#ptime');if(t)t.textContent=fmtS(l);
  const pill=$('#pill');const show=PM.run&&!(S.view==='day'&&S.settings.show.pomo);pill.hidden=!show;if(show)pill.textContent=`${PM.mode==='work'?'تمرکز':'استراحت'}، ${fmtS(l)}`}
let actx=null;function beep(force){if(!force&&!S.settings.pomo.sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(o=>{const os=actx.createOscillator(),g=actx.createGain();os.frequency.value=880;os.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.0001,actx.currentTime+o);g.gain.exponentialRampToValueAtTime(.25,actx.currentTime+o+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+o+.28);os.start(actx.currentTime+o);os.stop(actx.currentTime+o+.3)})}catch(e){}}
function pSave(){lsSet('pomo',PM)}
function pSet(mode){PM.mode=mode;PM.run=false;PM.left=pDur(mode);pSave();render()}
function pFinish(){const wasWork=PM.mode==='work';beep();if(document.hidden)sysNotify(wasWork?'جلسه‌ی تمرکز تمام شد':'استراحت تمام شد',wasWork?'وقت استراحت است.':'آماده‌ی جلسه‌ی بعد؟','pomo');
  if(wasWork){const d=today(),min=S.settings.pomo.work;let cat='none';
    if(PM.task){const t=findTask(PM.task,PM.tdate||d);if(t){t.spent=(t.spent||0)+min;cat=t.cat;markDirty(bkey(t.date))}}
    const f=B(d).focus[d]||(B(d).focus[d]={});f[cat]=(f[cat]||0)+min;markDirty(bkey(d));PM.count++;toast('یک جلسه‌ی تمرکز ثبت شد. وقت استراحت!')}
  else toast('استراحت تمام شد. آماده‌ی جلسه‌ی بعد؟');
  const next=wasWork?(PM.count%S.settings.pomo.every===0?'long':'short'):'work';PM.mode=next;PM.left=pDur(next);
  if(S.settings.pomo.auto){PM.run=true;PM.end=Date.now()+PM.left*1000}else PM.run=false;pSave();render()}
setInterval(()=>{if(PM.run){if(pLeft()<=0)pFinish();else pomoPaint()}},500);
if(PM.run&&pLeft()<=0){PM.run=false;PM.left=pDur(PM.mode)}

/* ---------- reminders ---------- */
const remLabel=m=>m===0?'سر وقت':m>=60&&m%60===0?(m===60?'یک ساعت قبل':fa(m/60)+' ساعت قبل'):fa(m)+' دقیقه قبل';
const remMin=x=>{if(x.rem===-1)return null;return x.rem!=null?x.rem:S.settings.remind.before};
function remChip(t){if(!t.start||t.done||!S.settings.remind.on)return '';const m=remMin(t);if(m==null)return '';return `<span class="chip num" title="یادآور">${I.bell.replace('class="i"','class="i" style="width:13px;height:13px"')}${remLabel(m)}</span>`}
const remFired=lsGet('remFired')||{},remSnz=lsGet('remSnz')||{};let remQ=[],remCur=null;
function remCheck(){const st=S.settings.remind;if(!st||!st.on)return;const d=today(),n=new Date(),nm=n.getHours()*60+n.getMinutes();
  for(const k in remFired)if(!k.startsWith(d))delete remFired[k];for(const k in remSnz)if(!k.startsWith(d))delete remSnz[k];
  for(const x of itemsOn(d)){if(x.done||!x.start)continue;const m=remMin(x);if(m==null)continue;const s0=toMin(x.start);const key=d+'|'+x.id+'|'+x.start+'|'+m;
    const due=remSnz[key]!=null?remSnz[key]:s0-m;
    if(nm>=due&&nm<s0+30&&!remFired[key]&&!remQ.some(q=>q.key===key)&&!(remCur&&remCur.key===key)){remFired[key]=1;remQ.push({key,id:x.id,date:d,title:x.title,start:x.start,cat:x.cat,kind:x.kind})}}
  lsSet('remFired',remFired);showRem()}
function showRem(){const el=$('#remind');if(remCur)return;remCur=remQ.shift()||null;if(!remCur){el.hidden=true;return}
  const n=new Date(),nm=n.getHours()*60+n.getMinutes(),left=toMin(remCur.start)-nm;const c=catOf(remCur.cat);
  el.innerHTML=`<div class="rt">${I.bell}<div style="min-width:0"><b>${esc(remCur.title)}</b><span class="muted num"><i class="dot" style="background:${remCur.kind==='p'?'var(--accent)':c.color}"></i> ${remCur.kind==='p'?'یادآور':esc(c.name)}، ساعت ${fmtT(remCur.start)}، ${left>0?fa(left)+' دقیقه دیگر':left===0?'همین الان':'شروع شده'}</span></div></div>
   <div class="rb"><button class="btn pri sm" data-act="remFocus">${I.play}شروع تمرکز</button><button class="btn sm" data-act="remDone">انجام شد</button><button class="btn sm" data-act="remSnooze">۱۰ دقیقه بعد</button><button class="btn sm ghost" data-act="remClose">بستن</button></div>`;
  el.hidden=false;if(S.settings.remind.sound)beep(true);
  if(document.hidden&&remCur.kind!=='p')sysNotify('⏰ '+remCur.title,(left>0?fa(left)+' دقیقه دیگر':'همین الان')+'، ساعت '+fmtT(remCur.start),'r-'+remCur.key)}
function remHide(){remCur=null;$('#remind').hidden=true;showRem()}
setInterval(remCheck,20000);

/* ---------- device reminders (PWA) ---------- */
const APP_VERSION='1.0.0';
const isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isMobile=isIOS||/Android/i.test(navigator.userAgent);
const isStandalone=()=>(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
const notifState=()=>!('Notification' in window)?'unsupported':Notification.permission;
async function sysNotify(title,body,tag){try{if(notifState()!=='granted')return false;const opt={body,tag:tag||'planner',icon:'icons/icon-192.png',badge:'icons/badge-96.png',dir:'rtl',lang:'fa',renotify:true,vibrate:[200,100,200],data:{url:'./'}};
  if('serviceWorker' in navigator){const reg=await navigator.serviceWorker.getRegistration();if(reg){await reg.showNotification(title,opt);return true}}
  new Notification(title,opt);return true}catch(e){return false}}
async function askNotif(){if(!('Notification' in window)){toast(isIOS?'در آیفون اول برنامه را به صفحه‌ی اصلی اضافه کن؛ بعد اعلان فعال می‌شود.':'این مرورگر اعلان را پشتیبانی نمی‌کند.');return 'unsupported'}
  let r;try{r=await Notification.requestPermission()}catch(e){r=Notification.permission}
  toast(r==='granted'?'اعلان‌ها فعال شد':r==='denied'?'اعلان رد شد؛ از تنظیمات مرورگر یا گوشی می‌شود دوباره فعالش کرد.':'اجازه داده نشد');return r}
const pushAll=()=>S.settings.push||(S.settings.push={});
const pushActive=()=>{const n=Date.now();return Object.entries(pushAll()).filter(([k,p])=>p&&!p.fired&&p.at>n).map(([k,p])=>({tid:k,...p})).sort((a,b)=>a.at-b.at)};
const fmtAt=ms=>{const d=new Date(ms);const di=iso(d);return `${WD[d.getDay()]} ${jlabel(di)}، ساعت ${fa(pad(d.getHours())+':'+pad(d.getMinutes()))}`};

async function savePush(){const v=pushFormValue();if(!v)return;if(v.at<=Date.now()){pushF.err='این زمان گذشته است؛ زمانی بعد از الان انتخاب کن.';drawPush();return}

let pushT=null;
function schedPush(){clearTimeout(pushT);const n=Date.now();const all=pushAll();let next=Infinity;
  for(const [id,p] of Object.entries(all)){if(!p||p.fired)continue;
    if(p.at<=n){p.fired=1;markDirty('settings');const late=n-p.at>120000;
      if(n-p.at<12*3600000){sysNotify('⏰ '+p.text,late?'یادآوری که از '+fmtAt(p.at)+' مانده بود':'یادآور برنامه‌ریز','p-'+id);
        const d=new Date(p.at);remQ.push({key:'p|'+id,id:p.taskId||'',date:p.date||iso(d),title:p.text,start:pad(d.getHours())+':'+pad(d.getMinutes()),cat:'none',kind:'p'});showRem()}}
    else next=Math.min(next,p.at)}
  for(const [id,p] of Object.entries(all))if(p&&p.fired&&p.at<n-30*86400000){delete all[id];markDirty('settings')}
  if(next<Infinity)pushT=setTimeout(schedPush,Math.min(next-n+200,60000))}

/* ---------- calendar (.ics) export ---------- */
const icsEsc=s=>String(s==null?'':s).replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
const ENC=new TextEncoder();
function icsFold(line){if(ENC.encode(line).length<=74)return line;const out=[];let cur='',len=0;for(const ch of line){const b=ENC.encode(ch).length;if(len+b>74){out.push(cur);cur=' '+ch;len=1+b}else{cur+=ch;len+=b}}out.push(cur);return out.join('\r\n')}
const icsDT=(d,t)=>d.replace(/-/g,'')+'T'+(t||'00:00').replace(':','')+'00';
const icsD=d=>d.replace(/-/g,'');
const icsStamp=()=>new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
const BYDAY=['SU','MO','TU','WE','TH','FR','SA'];
function addMin(d,t,m){const x=new Date(P(d).getTime()+(toMin(t)+m)*60000);return[iso(x),pad(x.getHours())+':'+pad(x.getMinutes())]}
function nextDow(from,w){let d=from;for(let i=0;i<7;i++){if(dow(d)===w)return d;d=addD(d,1)}return from}
function alarm(trig,text){return['BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(text),'TRIGGER'+trig,'END:VALARM']}
function vevent(o){const L=['BEGIN:VEVENT','UID:'+o.uid+'@planner.local','DTSTAMP:'+icsStamp()];
  if(o.allDay){L.push('DTSTART;VALUE=DATE:'+icsD(o.date),'DTEND;VALUE=DATE:'+icsD(addD(o.date,1)))}
  else{L.push('DTSTART;TZID=Asia/Tehran:'+icsDT(o.date,o.start));const[ed,et]=o.end&&toMin(o.end)>toMin(o.start)?[o.date,o.end]:addMin(o.date,o.start,o.dur||30);L.push('DTEND;TZID=Asia/Tehran:'+icsDT(ed,et))}
  if(o.rrule)L.push('RRULE:'+o.rrule);
  L.push('SUMMARY:'+icsEsc(o.title));if(o.loc)L.push('LOCATION:'+icsEsc(o.loc));if(o.desc)L.push('DESCRIPTION:'+icsEsc(o.desc));if(o.cat)L.push('CATEGORIES:'+icsEsc(o.cat));
  (o.alarms||[]).forEach(a=>L.push(...alarm(a,o.title)));L.push('END:VEVENT');return L}
function icsDoc(events){const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Planner//Barnamerizi 1.0//FA','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+icsEsc(S.settings.title||'برنامه‌ریز'),'X-WR-TIMEZONE:Asia/Tehran',
  'BEGIN:VTIMEZONE','TZID:Asia/Tehran','BEGIN:STANDARD','DTSTART:19700101T000000','TZOFFSETFROM:+0330','TZOFFSETTO:+0330','TZNAME:+0330','END:STANDARD','END:VTIMEZONE'];
  events.forEach(e=>L.push(...vevent(e)));L.push('END:VCALENDAR');return L.map(icsFold).join('\r\n')+'\r\n'}
function allWeeks(){flush();const m={};lsKeys().filter(k=>/^w-/.test(k)).forEach(k=>m[k]=normB(lsGet(k)));for(const[k,b] of Object.entries(S.B))m[k]=b;return m}
const dlTitle=x=>/^(حذفی|پایان‌ترم|امتحان|میان‌ترم|کوئیز)/.test(x.title)?x.title:x.type+': '+x.title;
function icsGroups(){const t0=today(),tm=S.D.term,rb=S.settings.remind.before||10;const termOn=d=>(!tm.start||d>=tm.start)&&(!tm.end||d<=tm.end);
  const until=tm.end&&tm.end>=t0?icsD(tm.end)+'T235959Z':null;
  const classes=tm.classes.filter(c=>!c.sample&&c.start).map(c=>{const first=nextDow(tm.start&&tm.start>t0?tm.start:t0,c.day);return{uid:'class-'+c.id,title:c.title,date:first,start:c.start,end:c.end,loc:c.room,desc:c.teacher?'استاد: '+c.teacher:'',cat:'کلاس',rrule:'FREQ=WEEKLY'+(until?';UNTIL='+until:';COUNT=16'),alarms:[':-PT'+rb+'M']}}).filter(e=>until||!tm.end);
  const exams=tm.deadlines.filter(x=>!x.sample&&!x.done&&x.date>=t0).map(x=>x.time?{uid:'dl-'+x.id,title:dlTitle(x),date:x.date,start:x.time,dur:120,desc:x.course||'',cat:x.type,alarms:[':-P1D',':-PT1H']}:{uid:'dl-'+x.id,title:dlTitle(x),date:x.date,allDay:true,desc:x.course||'',cat:x.type,alarms:[':-PT4H',';RELATED=START:PT7H']});
  const ws=allWeeks();const tasks=[];for(const b of Object.values(ws))for(const x of b.tasks){if(x.sample||x.done||!x.start||x.date<t0)continue;const m=remMin(x);tasks.push({uid:'task-'+x.id,title:x.title,date:x.date,start:x.start,end:x.end,dur:x.est||30,desc:x.notes||'',cat:catOf(x.cat).name,alarms:m==null||!S.settings.remind.on?[]:[':-PT'+m+'M']})}
  const routines=S.settings.routines.filter(r=>r.start&&r.days.length).map(r=>{let d=t0;for(let i=0;i<7&&!r.days.includes(dow(d));i++)d=addD(d,1);return{uid:'routine-'+r.id,title:r.title,date:d,start:r.start,end:r.end,cat:catOf(r.cat).name,rrule:'FREQ=WEEKLY;BYDAY='+r.days.map(w=>BYDAY[w]).join(',')+';UNTIL='+icsD(addD(t0,182))+'T235959Z',alarms:S.settings.remind.on?[':-PT'+rb+'M']:[]}});
  const reminders=pushActive().map(p=>{const d=new Date(p.at);return{uid:'rem-'+p.tid,title:p.text,date:iso(d),start:pad(d.getHours())+':'+pad(d.getMinutes()),dur:15,cat:'یادآور',alarms:[':PT0M']}});
  return{classes,exams,tasks,routines,reminders}}
let icsSel={classes:true,exams:true,tasks:true,routines:false,reminders:true};

async function saveFile(name,text,type){const blob=new Blob([text],{type:type+';charset=utf-8'});
  try{const file=new File([blob],name,{type});if(isMobile&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return 'shared'}}catch(e){if(e&&e.name==='AbortError')return 'cancel'}
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);return 'saved'}

function doSearch(q){S.q=q;const box=$('#sres');if(!q.trim()){box.hidden=true;return}const qq=q.trim().toLowerCase();const res=[];

const topicStatus=tp=>!tp.studied?['نخوانده','s0']:tp.revs.length===0?['خوانده‌شده','s1']:tp.revs.length>=INT.length?['تثبیت‌شده','s3']:['مرور '+fa(tp.revs.length),'s2'];

    ${S.D.term.classes.some(c=>!c.sample&&!st.subjects.some(s=>s.name===c.title))?`<button class="btn sm" data-act="studyFromTerm" style="margin-top:8px">ساختن درس‌ها از کلاس‌های ترم</button>`:''}</section>
  </div><div class="pcol">
   <section class="card"><h3>مرورهای امروز<span class="sp">فاصله‌ها: ۱، ۳، ۷، ۱۴ و ۳۰ روز</span></h3>${due.length?`<div class="plist">${due.map(({s,tp,d})=>`<div class="prow"><i class="dot" style="background:${s.color}"></i><div><b>${esc(tp.t)}</b><small>${esc(s.name)}، مرور ${fa(tp.revs.length+1)} از ${fa(INT.length)}${d<t0?'، '+dueLabel(daysTo(d)):''}</small></div><button class="btn sm pri" data-act="revDone" data-s="${s.id}" data-t="${tp.id}">مرور شد</button><button class="btn sm ghost" data-act="revSkip" data-s="${s.id}" data-t="${tp.id}">فردا</button></div>`).join('')}</div>`:'<div class="muted">مروری برای امروز نمانده.</div>'}</section>
   <section class="card"><h3>امتحان‌های پیش رو</h3>${exams.length?`<div class="plist">${exams.map(x=>{const n=daysTo(x.date);return `<div class="prow"><div><b>${esc(x.title)}</b><small>${esc(x.type)}، ${WD[dow(x.date)]} ${jlabel(x.date)}</small></div><span class="cd ${dueCls(n)} num">${dueLabel(n)}</span></div>`}).join('')}</div>`:'<div class="muted">امتحانی در برنامه‌ی ترم ثبت نشده.</div>'}</section>
   <section class="card"><h3>زمان مطالعه به تفکیک درس</h3>${st.subjects.length?st.subjects.map(s=>{const m=bySub[s.id]||0,tg=(s.target||0)*60,mx=Math.max(tg,m,1);return `<div class="hbar"><span><i class="dot" style="background:${s.color}"></i> ${esc(s.name)}</span><div class="tr" style="position:relative"><i style="width:${m/mx*100}%;background:${s.color}"></i>${tg?`<b class="tgt" style="inset-inline-start:${tg/mx*100}%" title="هدف"></b>`:''}</div><span class="num muted">${fa((m/60).toFixed(1))}/${fa(s.target||0)} ساعت</span></div>`}).join(''):'<div class="muted">درسی تعریف نشده.</div>'}</section>
  </div></div>`}
function subjCard(s,m){const done=s.topics.filter(t=>t.studied).length,tot=s.topics.length;const ed=editSubj===s.id;

    <span class="muted num" style="margin-inline-start:auto;font-size:.85em">${fa(done)}/${fa(tot)} مبحث، ${fa((m/60).toFixed(1))} ساعت این هفته</span><button class="iconbtn" style="height:30px;min-width:30px" data-act="editSubj" data-s="${s.id}" aria-label="ویرایش درس">${ed?I.chk:I.gear}</button></div>

/* ---- goals ---- */
let gFilter='active';
const gProg=g=>g.mode==='num'?(g.target?Math.min(1,(+g.current||0)/g.target):0):(g.ms.length?g.ms.filter(m=>m.d).length/g.ms.length:0);
function bigRing(p,c){const r=24,C=2*Math.PI*r;return `<svg class="gring" viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="${r}" stroke="var(--surface-2)"/><circle cx="30" cy="30" r="${r}" stroke="${c}" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 30 30)" stroke-linecap="round"/><text x="30" y="35" text-anchor="middle" font-size="14" font-weight="800" fill="var(--ink)">${fa(Math.round(p*100))}٪</text></svg>`}
function pGoals(){const gs=S.D.goals.goals;const act=gs.filter(g=>!g.done);const list=(gFilter==='active'?act:gs.filter(g=>g.done)).slice().sort((a,b)=>(a.deadline||'9').localeCompare(b.deadline||'9'));
  const avg=act.length?Math.round(act.reduce((a,g)=>a+gProg(g),0)/act.length*100):0;const near=act.filter(g=>g.deadline&&g.deadline>=today()).sort((a,b)=>a.deadline.localeCompare(b.deadline))[0];

  ${list.length?`<div class="ggrid">${list.map(goalCard).join('')}</div>`:`<div class="empty">${gFilter==='active'?'هنوز هدفی نساخته‌ای. با «هدف یا پروژه‌ی تازه» شروع کن؛ هدف را به گام‌های کوچک بشکن.':'هنوز هدفی به نتیجه نرسیده.'}</div>`}`}
function goalCard(g){const c=catOf(g.cat);const p=gProg(g);const n=g.deadline?daysTo(g.deadline):null;
  return `<article class="gcard${g.done?' gdone':''}"><div class="gtop">${bigRing(p,c.color)}<div style="min-width:0;flex:1"><h3 class="gt">${esc(g.title)}</h3>
    <div class="meta"><span class="chip"><i class="dot" style="background:${c.color}"></i>${esc(c.name)}</span>${g.deadline?`<span class="chip num">ددلاین ${jlabel(g.deadline)}</span><span class="cd ${g.done?'':dueCls(n)} num">${g.done?'انجام شد':dueLabel(n)}</span>`:''}${g.sample?'<span class="tag smp">نمونه</span>':''}</div></div></div>
   ${g.why?`<p class="gwhy">${esc(g.why)}</p>`:''}

/* ---- term ---- */
function pTerm(){const tm=S.D.term,t0=today();const ws=S.settings.weekStart;const order=[0,1,2,3,4,5,6].map(i=>(ws+i)%7);
  let prog='';if(tm.start&&tm.end&&tm.end>tm.start){const tot=daysTo(tm.end)-daysTo(tm.start);const el=Math.min(tot,Math.max(0,-daysTo(tm.start)));const wk=Math.floor(el/7)+1,wt=Math.ceil(tot/7);
    prog=`<div class="tprog"><div class="bar" style="height:8px"><i style="width:${el/tot*100}%"></i></div><span class="num muted">${t0<tm.start?'ترم '+dueLabel(daysTo(tm.start))+' شروع می‌شود':t0>tm.end?'ترم تمام شده':'هفته‌ی '+fa(wk)+' از '+fa(wt)+'، '+fa(daysTo(tm.end))+' روز تا پایان ترم'}</span></div>`}
  const cls=tm.classes;let h0=8,h1=18;cls.forEach(c=>{if(c.start)h0=Math.min(h0,+c.start.slice(0,2));if(c.end)h1=Math.max(h1,Math.ceil(toMin(c.end)/60))});const H=46;
  const showDays=order.filter(w=>w!==5||cls.some(c=>c.day===5));

  const up=tm.deadlines.filter(x=>!x.done&&x.date>=t0).sort((a,b)=>a.date.localeCompare(b.date));const past=tm.deadlines.filter(x=>x.done||x.date<t0).sort((a,b)=>b.date.localeCompare(a.date));

function readG(){const o=gEdit.o;if(gEdit.type==='goal'){o.title=$('#g-title').value.trim();o.why=$('#g-why').value.trim();o.cat=$('#g-cat').value;o.deadline=$('#g-dl').value;o.notes=$('#g-notes').value;

  else{if(o.end&&o.start&&o.end<=o.start){toast('ساعت پایان باید بعد از شروع باشد');return}const L=S.D.term.classes;if(o.id){const i=L.findIndex(x=>x.id===o.id);delete o.sample;L[i]=o}else{o.id=rid();L.push(o)}markDirty('term')}
