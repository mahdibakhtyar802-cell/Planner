/* ---- planner events ---- */
function planClick(act,a,e){const st=S.D.study;
  switch(act){
  case 'ptab':S.ptab=a.dataset.v;render();return true;
  case 'jset':{const d=a.dataset.d,k=a.dataset.j,v=+a.dataset.v;const cur=k.split('.').reduce((o,p)=>o&&o[p],J(d));setJ(d,k,cur===v?0:v);render();return true}
  case 'water':{const d=a.dataset.d,v=+a.dataset.v;setJ(d,'water',J(d).water===v?v-1:v);render();return true}
  case 't3ToTasks':{const d=a.dataset.date;const j=J(d);const ex=itemsOn(d).map(x=>x.title);let n=0;j.top3.forEach(x=>{if(x.t.trim()&&!ex.includes(x.t.trim())){addTask(d,{title:x.t.trim(),prio:2});n++}});toast(n?fa(n)+' کار مهم به فهرست اضافه شد':'چیز تازه‌ای برای افزودن نبود');render();return true}
  case 'editSubj':editSubj=editSubj===a.dataset.s?null:a.dataset.s;render();return true;
  case 'delSubj':if(a.dataset.c!=='1'){a.dataset.c='1';a.innerHTML=I.trash+'مطمئنی؟ دوباره بزن';return true}st.subjects=st.subjects.filter(s=>s.id!==a.dataset.s);editSubj=null;markDirty('study');render();return true;
  case 'topicRead':{const tp=subjOf(a.dataset.s).topics.find(x=>x.id===a.dataset.t);if(tp){tp.studied=today();tp.revs=[];markDirty('study');toast('مرور اول برای فردا زمان‌بندی شد')}render();return true}
  case 'topicDel':{const s=subjOf(a.dataset.s);s.topics=s.topics.filter(x=>x.id!==a.dataset.t);markDirty('study');render();return true}
  case 'revDone':{const tp=subjOf(a.dataset.s).topics.find(x=>x.id===a.dataset.t);if(tp){tp.revs.push(today());tp.snooze='';markDirty('study');const nx=topicDue(tp);toast(nx?'مرور بعدی: '+jlabel(nx):'این مبحث تثبیت شد')}render();return true}
  case 'revSkip':{const tp=subjOf(a.dataset.s).topics.find(x=>x.id===a.dataset.t);if(tp){tp.snooze=addD(today(),1);markDirty('study')}render();return true}
  case 'delSess':{const d=a.dataset.date;const b=B(d);b.st[d]=(b.st[d]||[]).filter(x=>x.id!==a.dataset.sid);markDirty(bkey(d));render();return true}
  case 'studyFromTerm':{const names=[...new Set(S.D.term.classes.filter(c=>!c.sample).map(c=>c.title))];names.forEach(n=>{if(!st.subjects.some(s=>s.name===n)){const c=S.D.term.classes.find(x=>x.title===n);st.subjects.push({id:rid(),name:n,color:c.color||'#2F6FDB',target:4,topics:[]})}});markDirty('study');render();return true}
  case 'gfilter':gFilter=a.dataset.v;render();return true;
  case 'goalNew':openGoal();return true;
  case 'goalEdit':openGoal(a.dataset.g);return true;
  case 'gms':{const g=S.D.goals.goals.find(x=>x.id===a.dataset.g);const m=g&&g.ms.find(x=>x.id===a.dataset.m);if(m){m.d=!m.d;markDirty('goals');if(g.ms.every(x=>x.d))toast('همه‌ی گام‌ها انجام شد؛ اگر به نتیجه رسیدی، علامتش بزن.')}render();return true}
  case 'gnum':{const g=S.D.goals.goals.find(x=>x.id===a.dataset.g);if(g){g.current=Math.max(0,(+g.current||0)+ +a.dataset.n);markDirty('goals')}render();return true}
  case 'gToday':{const g=S.D.goals.goals.find(x=>x.id===a.dataset.g);const m=g&&g.ms.find(x=>!x.d);if(m){addTask(today(),{title:m.t+' ('+g.title+')',cat:g.cat,prio:2});toast('به کارهای امروز اضافه شد')}render();return true}
  case 'gDone':{const g=S.D.goals.goals.find(x=>x.id===a.dataset.g);if(g){g.done=!g.done;g.doneAt=g.done?today():'';markDirty('goals');if(g.done)toast('آفرین! یک هدف دیگر به نتیجه رسید.')}render();return true}
  case 'gmode':readG();gEdit.o.mode=a.dataset.v;drawG();return true;
  case 'gClose':$('#gDlg').close();return true;
  case 'gDel':if(!gEdit.confirmDel){readG();gEdit.confirmDel=true;drawG();return true}delG();return true;
  case 'classNew':openClass();return true;
  case 'classEdit':openClass(a.dataset.id);return true;
  case 'dlDone':{const x=S.D.term.deadlines.find(y=>y.id===a.dataset.id);if(x){x.done=!x.done;markDirty('term')}render();return true}
  case 'dlDel':{if(a.dataset.c!=='1'){a.dataset.c='1';a.innerHTML=I.trash;a.title='برای حذف دوباره بزن';a.style.color='var(--danger)';return true}S.D.term.deadlines=S.D.term.deadlines.filter(y=>y.id!==a.dataset.id);markDirty('term');render();return true}
  case 'dlPush':{const x=S.D.term.deadlines.find(y=>y.id===a.dataset.id);if(!x)return true;openPush();pushF.text=x.type+': '+x.title+' — '+WD[dow(x.date)]+' '+jlabel(x.date)+(x.time?' ساعت '+fa(x.time):'');const pd=addD(x.date,-1);if(pd>=today()){pushF.date=pd;pushF.time='20:00'}drawPush();return true}
  case 'clearDocSample':clearDocSamples();toast('نمونه‌های پلنر حذف شدند');render();return true;
  }return false}
function planSubmit(f){
  if(f.id==='sessForm'){const sj=$('#s-subj').value,topic=$('#s-topic').value.trim(),d=$('#s-date').value||today(),min=+$('#s-min').value||0;if(!min){toast('مدت مطالعه را بنویس');return true}
    const n=+$('#s-n').value||0,c=+$('#s-c').value||0,w=+$('#s-w').value||0;if(c+w>n&&n){toast('جمع درست و غلط از تعداد تست بیشتر است');return true}
    ensure([d]).then(()=>{const b=B(d);(b.st[d]||(b.st[d]=[])).push({id:rid(),subj:sj,topic,min,n:n||(c+w),c,w,note:$('#s-note').value.trim()});markDirty(bkey(d));
      const s=subjOf(sj);let tp=s.topics.find(x=>x.t===topic);if(topic&&!tp&&s.id){tp={id:rid(),t:topic,studied:'',revs:[],snooze:''};s.topics.push(tp)}if(tp&&!tp.studied){tp.studied=d;tp.revs=[]}if(s.id)markDirty('study');toast('جلسه ثبت شد');render()});return true}
  if(f.id==='subjForm'){const v=$('#subj-new').value.trim();if(!v)return true;const pal=['#2F6FDB','#C2417A','#2E9E6B','#D9822B','#7A5AC8','#1F8A9E','#9E5B1F'];S.D.study.subjects.push({id:rid(),name:v,color:pal[S.D.study.subjects.length%pal.length],target:4,topics:[]});markDirty('study');render();$('#subj-new')&&$('#subj-new').focus();return true}
  if(f.id==='dlForm'){const t=$('#dl-title').value.trim(),d=$('#dl-date').value;if(!t||!d)return true;S.D.term.deadlines.push({id:rid(),title:t,type:$('#dl-type').value,date:d,time:$('#dl-time').value,course:$('#dl-course').value.trim(),done:false});markDirty('term');render();toast('ثبت شد');return true}
  if(f.id==='gForm'){saveG();return true}
  return false}
function planInput(t){
  if(t.dataset.j&&t.dataset.d&&t.type!=='checkbox'){setJ(t.dataset.d,t.dataset.j,t.value);return true}
  if(t.dataset.tf&&t.type!=='checkbox'&&t.type!=='date'){S.D.term[t.dataset.tf]=t.value;markDirty('term');return true}
  if(t.dataset.sf&&t.type==='text'){subjOf(t.dataset.s).name=t.value;markDirty('study');return true}
  if(t.id==='s-wg'){S.D.study.weekGoal=Math.max(0,+t.value||0);markDirty('study');return true}
  return false}
function planChange(t){
  if(t.dataset.j&&t.dataset.d&&t.type==='checkbox'){setJ(t.dataset.d,t.dataset.j,t.checked);render();return true}
  if(t.dataset.tf){S.D.term[t.dataset.tf]=t.type==='checkbox'?t.checked:t.value;markDirty('term');render();return true}
  if(t.dataset.sf&&t.type!=='text'){const s=subjOf(t.dataset.s);s[t.dataset.sf]=t.type==='number'?Math.max(0,+t.value||0):t.value;markDirty('study');render();return true}
  if(t.id==='s-wg'){render();return true}
  return false}
function planKey(e){const t=e.target;if(t.classList&&t.classList.contains('addtopic')&&e.key==='Enter'){e.preventDefault();const v=t.value.trim();if(!v)return true;subjOf(t.dataset.s).topics.push({id:rid(),t:v,studied:'',revs:[],snooze:''});markDirty('study');render();const n=document.getElementById('at-'+t.dataset.s);n&&n.focus();return true}return false}

/* ---------- events ---------- */
const app=$('#app');
app.addEventListener('click',async e=>{const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;if(planClick(act,a,e)||pwaClick(act,a))return;const row=a.closest('[data-id]');const id=row&&row.dataset.id,d=row&&row.dataset.date;
  switch(act){
  case 'view':S.view=a.dataset.v;render();break;
  case 'shift':S.cur=addD(S.cur,+a.dataset.n);render();break;
  case 'today':S.cur=today();render();break;
  case 'month':{const {f,l}=monthCells(S.cur);S.cur=+a.dataset.n>0?addD(l,1):addD(f,-1);render();break}
  case 'goday':S.cur=a.dataset.date;S.view='day';$('#sres').hidden=true;render();if(a.dataset.open){await ensure([a.dataset.date]);openEditor(a.dataset.open,a.dataset.date)}break;
  case 'filter':S.filter=a.dataset.c;render();break;
  case 'hideDone':S.hideDone=!S.hideDone;render();break;
  case 'toggle':e.preventDefault();toggleItem(id,d);break;
  case 'edit':if(e.target.closest('.subs'))return;if(id&&!id.includes(':'))openEditor(id,d);break;
  case 'sub':{const t=findTask(id,d);const s=t&&t.subs.find(x=>x.id===a.dataset.sid);if(s){s.d=a.checked;if(t.subs.every(x=>x.d)&&!t.done)toast('همه‌ی زیرکارها انجام شد؛ خود کار را هم تیک بزن.');markDirty(bkey(d));render()}break}
  case 'tomorrow':moveTask(id,d,addD(d,1));toast('به فردا منتقل شد');break;
  case 'toToday':moveTask(id,d,today());break;
  case 'allToToday':{const t0=today();for(let i=1;i<=14;i++){const p=addD(t0,-i);const b=S.B[bkey(p)];if(!b)continue;b.tasks.filter(t=>t.date===p&&!t.done).forEach(t=>{b.tasks.splice(b.tasks.indexOf(t),1);t.date=t0;B(t0).tasks.push(t);markDirty(bkey(p))})}markDirty(bkey(t0));render();break}
  case 'focus':if(id.includes(':')){PM.task=''}else{PM.task=id;PM.tdate=d}PM.mode='work';PM.left=pDur('work');PM.run=true;PM.end=Date.now()+PM.left*1000;pSave();S.view='day';S.cur=today();render();try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}$('#pomo')&&$('#pomo').scrollIntoView({behavior:'smooth',block:'center'});break;
  case 'gofocus':S.view='day';S.cur=today();render();break;
  case 'remFocus':{const r=remCur;if(r){if(r.kind==='t'){PM.task=r.id;PM.tdate=r.date}else PM.task='';PM.mode='work';PM.left=pDur('work');PM.run=true;PM.end=Date.now()+PM.left*1000;pSave();S.view='day';S.cur=today();render()}remHide();break}
  case 'remDone':{const r=remCur;if(r){const it=itemsOn(r.date).find(x=>x.id===r.id);if(it&&!it.done)toggleItem(r.id,r.date)}remHide();break}
  case 'remSnooze':{const r=remCur;if(r){const n=new Date();remSnz[r.key]=n.getHours()*60+n.getMinutes()+10;delete remFired[r.key];lsSet('remSnz',remSnz);lsSet('remFired',remFired);toast('۱۰ دقیقه‌ی دیگر یادآوری می‌کنم')}remHide();break}
  case 'remClose':remHide();break;
  case 'pushOpen':openPush();break;
  case 'pushTask':{const it=itemsOn(d).find(x=>x.id===id)||{id,date:d,title:'',kind:'t'};openPush(it);break}
  case 'pushClose':$('#pushDlg').close();break;
  case 'pushQuick':{readPush();const at=new Date(Date.now()+ +a.dataset.m*60000);pushF.date=iso(at);pushF.time=pad(at.getHours())+':'+pad(at.getMinutes());drawPush();break}
  case 'pushCancel':cancelPush(a.dataset.tid);break;
  case 'habit':{const dd=a.dataset.date,b=B(dd);const arr=b.habits[dd]||(b.habits[dd]=[]);const i=arr.indexOf(a.dataset.h);i>=0?arr.splice(i,1):arr.push(a.dataset.h);markDirty(bkey(dd));render();break}
  case 'goal':{const ws=wstart(S.cur);const g=(B(ws).goals[ws]||[]).find(x=>x.id===a.dataset.g);if(g){g.d=!g.d;markDirty(bkey(ws));render()}break}
  case 'delGoal':{const ws=wstart(S.cur);B(ws).goals[ws]=(B(ws).goals[ws]||[]).filter(x=>x.id!==a.dataset.g);markDirty(bkey(ws));render();break}
  case 'clearSample':for(const [k,b] of Object.entries(S.B)){const n=b.tasks.length;b.tasks=b.tasks.filter(t=>!t.sample);let ch=n!==b.tasks.length;for(const w in b.goals){const m=b.goals[w].length;b.goals[w]=b.goals[w].filter(g=>!g.sample);if(m!==b.goals[w].length)ch=true}if(ch)markDirty(k)}S.sample=false;markDirty('settings');toast('نمونه‌ها حذف شدند');render();if($('#setDlg').open)drawSettings();break;
  case 'settings':openSettings(a.dataset.tab);break;
  case 'pmode':pSet(a.dataset.m);break;
  case 'pstart':try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(e){}
    if(PM.run){PM.left=pLeft();PM.run=false}else{if(PM.left<=0)PM.left=pDur(PM.mode);PM.end=Date.now()+PM.left*1000;PM.run=true;const sel=$('#ptask');if(sel){PM.task=sel.value;PM.tdate=today()}}pSave();render();break;
  case 'preset':PM.run=false;PM.left=pDur(PM.mode);pSave();render();break;
  case 'pskip':{const next=PM.mode==='work'?'short':'work';pSet(next);break}
  /* editor */
  case 'closeDlg':$('#taskDlg').close();break;
  case 'eprio':readEditor();edit.t.prio=+a.dataset.v;drawEditor();break;
  case 'esubdel':readEditor();edit.t.subs.splice(+a.dataset.si,1);drawEditor();break;
  case 'erep':{readEditor();const w=+a.dataset.w;const i=edit.rep.indexOf(w);i>=0?edit.rep.splice(i,1):edit.rep.push(w);drawEditor();break}
  case 'edel':if(!edit.confirmDel){readEditor();edit.confirmDel=true;drawEditor();break}{const b=B(edit.orig);b.tasks=b.tasks.filter(x=>x.id!==edit.t.id);markDirty(bkey(edit.orig));$('#taskDlg').close();toast('کار حذف شد');render()}break;
  case 'edup':{readEditor();const c=clone(edit.t);c.id=rid();c.done=false;c.spent=0;c.created=Date.now();delete c.sample;c.subs.forEach(s=>{s.d=false;s.id=rid()});B(c.date).tasks.push(c);markDirty(bkey(c.date));$('#taskDlg').close();toast('یک کپی ساخته شد');render();break}
  /* settings */
  case 'closeSet':$('#setDlg').close();flush();break;
  case 'stab':stab=a.dataset.tab;drawSettings();break;
  case 'sset':set(a.dataset.k,a.dataset.t==='num'?+a.dataset.v:a.dataset.v);settingsChanged(true);break;
  case 'ladd':{const l=a.dataset.l;const st=S.settings;if(l==='cats')st.cats.push({id:rid(),name:'دسته‌ی تازه',color:'#7A5AC8'});if(l==='habits')st.habits.push({id:rid(),name:'عادت تازه',days:[0,1,2,3,4,5,6]});if(l==='routines')st.routines.push({id:rid(),title:'کار تکراری',cat:(st.cats[0]||{}).id,start:'',end:'',prio:1,days:[6,0,1,2,3]});settingsChanged(true);const ins=document.querySelectorAll(`#sbody input[type=text][data-l="${l}"]`);ins.length&&(ins[ins.length-1].focus(),ins[ins.length-1].select());break}
  case 'ldel':{const l=a.dataset.l;if(l==='cats'&&S.settings.cats.length<=1){toast('حداقل یک دسته لازم است');break}S.settings[l].splice(+a.dataset.i,1);if(l==='cats'&&!S.settings.cats.some(c=>c.id===S.filter))S.filter='all';settingsChanged(true);break}
  case 'lday':{const it=S.settings[a.dataset.l][+a.dataset.i];const w=+a.dataset.w;const i=it.days.indexOf(w);i>=0?it.days.splice(i,1):it.days.push(w);settingsChanged(true);break}
  case 'export':doExport();break;
  case 'copyExp':{const ta=$('#exptxt');try{await navigator.clipboard.writeText(ta.value);toast('کپی شد')}catch(err){ta.select();toast('متن انتخاب شد؛ کپی کن')}break}
  case 'resetAll':if(!confirmReset){confirmReset=true;drawSettings();break}await resetAll();break;
  }});
app.addEventListener('change',e=>{const t=e.target;if(planChange(t)||pwaChange(t))return;
  if(t.id==='sortSel'){S.settings.sort=t.value;markDirty('settings');render()}
  else if(t.id==='jump'&&t.value){S.cur=t.value;render()}
  else if(t.id==='ptask'){PM.task=t.value;PM.tdate=today();pSave()}
  else if(t.id==='imp'&&t.files[0]){doImport(t.files[0]);t.value=''}
  else if(t.dataset.k&&t.dataset.t==='bool'){set(t.dataset.k,t.checked);settingsChanged(false)}
  else if(t.dataset.l&&t.dataset.f&&(t.tagName==='SELECT'||t.type==='time'||t.type==='color')){S.settings[t.dataset.l][+t.dataset.i][t.dataset.f]=t.value;settingsChanged(false)}});
let inT;app.addEventListener('input',e=>{const t=e.target;if(planInput(t))return;
  if(t.id==='note'){const d=S.cur;B(d).notes[d]=t.value;markDirty(bkey(d))}
  else if(t.id==='q')doSearch(t.value);
  else if(t.closest('#setDlg')&&t.dataset.k&&t.dataset.t!=='bool'){let v=t.value;if(t.dataset.t==='num'){v=+v;if(isNaN(v)||t.value==='')return;if(t.dataset.k==='hours.to'&&v<=S.settings.hours.from)return;if(t.dataset.k==='hours.from'&&v>=S.settings.hours.to)return}set(t.dataset.k,v);clearTimeout(inT);inT=setTimeout(()=>settingsChanged(false),250)}
  else if(t.closest('#setDlg')&&t.dataset.l&&t.dataset.f&&t.type==='text'){S.settings[t.dataset.l][+t.dataset.i][t.dataset.f]=t.value;clearTimeout(inT);inT=setTimeout(()=>settingsChanged(false),300)}});
app.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(planSubmit(f))return;
  if(f.id==='qform'){const inp=$('#qa');if(!inp.value.trim())return;const {d,o}=parseQuick(inp.value,S.cur);if(!o.title)return;ensure([d]).then(()=>{addTask(d,o);inp.value='';if(d!==S.cur)toast('برای فردا اضافه شد');render();$('#qa').focus()})}
  else if(f.id==='gform'){const inp=$('#ga');const v=inp.value.trim();if(!v)return;const ws=wstart(S.cur);(B(ws).goals[ws]||(B(ws).goals[ws]=[])).push({id:rid(),t:v,d:false});markDirty(bkey(ws));render();$('#ga').focus()}
  else if(f.id==='eform')saveEditor();
  else if(f.id==='pform'&&!pushF.busy)savePush()});
app.addEventListener('keydown',e=>{const t=e.target;if(planKey(e))return;
  if(t.classList&&t.classList.contains('wadd')&&e.key==='Enter'){e.preventDefault();const v=t.value.trim();if(!v)return;const {d,o}=parseQuick(v,t.dataset.addday);ensure([d]).then(()=>{addTask(d,o);render();const n=document.getElementById('wadd-'+t.dataset.addday);n&&n.focus()})}
  else if(t.id==='e-newsub'&&e.key==='Enter'){e.preventDefault();readEditor();drawEditor();$('#e-newsub').focus()}
  else if(t.id==='q'&&e.key==='Escape'){t.value='';doSearch('')}});
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea,select,dialog,[contenteditable]'))return;if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k==='n'||k==='د'){if(S.view!=='day'){S.view='day';render()}e.preventDefault();$('#qa')&&$('#qa').focus()}
  else if(e.key==='ArrowLeft'){S.cur=addD(S.cur,S.view==='week'||S.view==='stats'||S.view==='plan'&&S.ptab==='study'?7:S.view==='month'?0:1);if(S.view==='month'){const{l}=monthCells(S.cur);S.cur=addD(l,1)}render()}
  else if(e.key==='ArrowRight'){if(S.view==='month'){const{f}=monthCells(S.cur);S.cur=addD(f,-1)}else S.cur=addD(S.cur,S.view==='week'||S.view==='stats'||S.view==='plan'&&S.ptab==='study'?-7:-1);render()}
  else if(k==='t'||k==='ف'){S.cur=today();render()}
  else if(k&&'12345'.includes(k)){S.view=['day','week','month','plan','stats'][+k-1];render()}});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('#sres')&&($('#sres').hidden=true)});
/* drag & drop (week) */
app.addEventListener('dragstart',e=>{const w=e.target.closest('.wt[draggable]');if(!w)return;e.dataTransfer.setData('text/plain',w.dataset.id+'|'+w.dataset.date);e.dataTransfer.effectAllowed='move'});
app.addEventListener('dragover',e=>{const c=e.target.closest('[data-drop]');if(!c)return;e.preventDefault();document.querySelectorAll('.wcol.over').forEach(x=>x!==c&&x.classList.remove('over'));c.classList.add('over')});
app.addEventListener('dragleave',e=>{const c=e.target.closest('[data-drop]');if(c&&!c.contains(e.relatedTarget))c.classList.remove('over')});
app.addEventListener('drop',e=>{const c=e.target.closest('[data-drop]');if(!c)return;e.preventDefault();c.classList.remove('over');const[id,from]=(e.dataTransfer.getData('text/plain')||'').split('|');if(id&&from)moveTask(id,from,c.dataset.drop)});
$('#setDlg').addEventListener('close',()=>flush());

/* ---------- export / import / reset ---------- */
async function allData(){const out={app:'planner',v:1,exported:new Date().toISOString(),settings:S.settings,docs:S.D,weeks:{}};
  if(S.mode==='db'){try{const qs=await S.db.collection('data/users/'+S.uid).limit(1000).get();qs.docs.forEach(d=>{if(d.id.startsWith('w-'))out.weeks[d.id]=d.data()})}catch(e){}}
  else lsKeys().filter(k=>k.startsWith('w-')).forEach(k=>out.weeks[k]=lsGet(k));
  for(const[k,b] of Object.entries(S.B))if(b.tasks.length||Object.keys(b.notes).length||Object.keys(b.habits).length)out.weeks[k]=b;return out}
async function doExport(){const data=JSON.stringify(await allData(),null,1);const j=jal(today());const name=`planner-backup-${j.y}-${pad(j.m)}-${pad(j.d)}.json`;
  const res=await saveFile(name,data,'application/json');if(res==='cancel')return;lsSet('lastBackup',Date.now());toast('فایل پشتیبان ذخیره شد');render();if($('#setDlg').open)drawSettings()}
function doImport(file){const r=new FileReader();r.onload=async()=>{try{const o=JSON.parse(r.result);if(!o||o.app!=='planner'||!o.settings)throw 0;
  S.settings=merge(defaults(),o.settings);S.B={};for(const[k,b] of Object.entries(o.weeks||{})){if(/^w-\d{4}-\d{2}-\d{2}$/.test(k)){const nb=normB(b);markL(nb);S.B[k]=nb;markDirty(k)}}
  if(o.docs)DOCS.forEach(k=>{if(o.docs[k]){S.D[k]=normDoc(k,o.docs[k]);markDirty(k)}});
  S.sample=false;markDirty('settings');flush();applyLook();render();if($('#setDlg').open)drawSettings();schedPush();toast('پشتیبان بازگردانی شد')}catch(e){toast('این فایل پشتیبان این برنامه نیست یا خراب است.')}};r.readAsText(file)}
async function resetAll(){const keys=new Set([...lsKeys(),...Object.keys(S.B),'settings',...DOCS]);
  if(S.mode==='db'){try{const qs=await S.db.collection('data/users/'+S.uid).limit(1000).get();qs.docs.forEach(d=>keys.add(d.id))}catch(e){}for(const k of keys){try{await ref(k).delete()}catch(e){}}}
  keys.forEach(k=>lsDel(k));dirty.clear();S.settings=defaults();S.B={};S.D={};DOCS.forEach(k=>S.D[k]=normDoc(k,{}));S.sample=false;settingsSaved=false;confirmReset=false;$('#setDlg').close();applyLook();render();toast('همه‌ی داده‌ها پاک شد')}

/* ---------- boot ---------- */
function bootLocal(){loadDocsLocal();const s=lsGet('settings');
  if(s){S.settings=merge(defaults(),s);settingsSaved=true;S.mode='ls';const t=today();for(let i=-35;i<=14;i+=7){const k=bkey(addD(t,i));const nb=normB(lsGet(k));markL(nb);S.B[k]=nb}
    S.sample=Object.values(S.B).some(b=>b.tasks.some(x=>x.sample))}
  else{S.sample=true;S.mode='ls';sampleData()}
  S.view=S.settings.defaultView||'day'}
async function bootDb(){if(!window.claude||!window.claude.use)return;let db=null,user=null;
  try{[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}catch(e){return}
  if(!db||!user)return;let id=null;try{id=await user.id()}catch(e){}if(!id)return;
  S.db=db;S.uid=id;let sn;try{sn=await db.collection('data/users/'+id).doc('settings').get()}catch(e){return}
  S.mode='db';
  if(sn.exists){S.settings=merge(defaults(),clone(sn.data()));settingsSaved=true;const keep=dirty.size;S.B={};S.sample=false;
    const t=today();const ks=[];for(let i=-35;i<=14;i+=7)ks.push(addD(t,i));await Promise.all([ensure(ks),loadDocsDb()]);S.sample=Object.values(S.B).some(b=>b.tasks.some(x=>x.sample));applyLook();render()}
  else{const dbDocs={};await Promise.all(DOCS.map(async k=>{try{const s2=await ref(k).get();if(s2.exists)dbDocs[k]=normDoc(k,clone(s2.data()))}catch(e){}}));
    DOCS.forEach(k=>{if(dbDocs[k])S.D[k]=dbDocs[k];else if(settingsSaved&&lsGet(k))dirty.add(k)});
    if(settingsSaved){/* migrate this browser's data into the account */const ks=new Set([...lsKeys().filter(k=>k.startsWith('w-')),...Object.keys(S.B)]);for(const k of ks){if(!S.B[k]){const nb=normB(lsGet(k));markL(nb);S.B[k]=nb}dirty.add(k)}dirty.add('settings');flush()}
    else if(dirty.size)flush();
    if(Object.keys(dbDocs).length)render()}}
bootLocal();applyLook();render();route();schedPush();if(!lsGet('settings')&&!lsGet('welcomed'))setTimeout(openWelcome,250);
setInterval(()=>{if(S.view==='day'&&S.cur===today()&&!document.querySelector('dialog[open]')&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))render()},60000);
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&S.mode==='db'&&!dirty.size){for(const k of Object.keys(S.B)){try{const sn=await ref(k).get();if(sn.exists){const nb=normB(clone(sn.data()));markL(nb);S.B[k]=nb}}catch(e){}}render()}});
const tl=()=>{const el=$('#tl');if(el&&S.cur===today()){const n=new Date();el.scrollTop=Math.max(0,((n.getHours()-S.settings.hours.from)*44)-100)}};tl();
remCheck();setTimeout(remCheck,1500);
})();
</script>
